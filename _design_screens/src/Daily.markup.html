
<div style="width: 390px; height: 100%; box-sizing: border-box; background: #171A36; color: #FFFFFF; font-family: 'Baloo 2', system-ui, sans-serif; padding: 56px 20px 32px; padding: max(56px, calc(var(--sat, 0px) + 14px)) 20px max(32px, calc(var(--sab, 0px) + 12px)); display: flex; flex-direction: column; gap: 20px; overflow-y: auto">
<div style="display: flex; align-items: center; justify-content: space-between">
<a href="Main.dc.html" aria-label="Geri" style="width: 44px; height: 44px; border-radius: 14px; background: #232750; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.500" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
</a>
<h1 style="margin: 0; font-size: 24px; font-weight: 600">Günlük bulmaca</h1>
<a href="Reward.dc.html" aria-label="Günlük ödül" style="width: 44px; height: 44px; border-radius: 14px; background: #232750; color: #FFD35C; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="9" width="18" height="12" rx="2"/><path d="M12 9v12M3 13h18M8.500 9C6 9 5.500 5 8 5s4 4 4 4M15.500 9C18 9 18.500 5 16 5s-4 4-4 4"/></svg>
</a>
</div>
<div style="display: flex; align-items: center; gap: 14px; padding: 16px; background: #232750; border-radius: 20px">
<div style="width: 52px; height: 52px; flex-shrink: 0; box-sizing: border-box; padding-bottom: 5px; background: #FF9F45; border-radius: 16px; box-shadow: inset 0 -5px 0 #D9772A; color: #171A36; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c1 3 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-6 1-9z"/></svg>
</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 20px; font-weight: 600; line-height: 1.1">{{ streakLabel }}</div>
<div style="font-size: 14px; color: #B9BDE6">{{ streakSub }}</div>
</div>
</div>
<div style="padding: 16px; background: #232750; border-radius: 20px; display: flex; flex-direction: column; gap: 12px">
<div style="font-size: 18px; font-weight: 600">{{ monthLabel }}</div>
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; font-size: 12px; font-weight: 500; color: #B9BDE6; text-align: center">
<span>Pzt</span><span>Sal</span><span>Çar</span><span>Per</span><span>Cum</span><span>Cmt</span><span>Paz</span>
</div>
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{ days }}" as="d" hint-placeholder-count="35">
<div style="height: 40px; box-sizing: border-box; border-radius: 12px; background: {{d.bg}}; border: {{d.border}}; color: {{d.fg}}; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center">{{ d.n }}</div>
</sc-for>
</div>
<div style="display: flex; justify-content: center; gap: 16px; font-size: 13px; color: #B9BDE6">
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; border-radius: 4px; background: #3DD6C3"></span>Çözüldü</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; border-radius: 4px; background: #FF9F45"></span>Bugün</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; box-sizing: border-box; border-radius: 4px; border: 2px solid #3A4080"></span>Kaçırıldı</span>
</div>
</div>
<div style="margin-top: auto; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; background: #232750; border-radius: 18px; font-size: 16px; font-weight: 500">
<span>{{ dateLabel }}</span>
<span style="display: flex; align-items: center; gap: 6px; color: #FFD35C">
<svg viewBox="0 0 24 24" width="18" height="18" fill="#FFD35C" aria-hidden="true"><path d="M12 2.500l2.900 6.200 6.600.8-4.900 4.600 1.300 6.600L12 17.400l-5.900 3.300 1.300-6.600-4.900-4.600 6.600-.8z"/></svg>
{{ rewardLabel }}</span>
</div>
<button onclick="{{ play }}" style="height: 72px; box-sizing: border-box; padding-bottom: 6px; border: 0; background: #FF9F45; border-radius: 22px; box-shadow: inset 0 -6px 0 #D9772A; color: #171A36; font-family: inherit; text-decoration: none; font-size: 22px; font-weight: 700; display: flex; align-items: center; justify-content: center; cursor: pointer">{{ playLabel }}</button>
</div>
</div>
