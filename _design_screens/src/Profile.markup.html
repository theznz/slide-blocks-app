
<div style="width: 390px; height: 100%; box-sizing: border-box; background: #171A36; color: #FFFFFF; font-family: 'Baloo 2', system-ui, sans-serif; padding: 56px 20px 32px; padding: max(56px, calc(var(--sat, 0px) + 14px)) 20px max(32px, calc(var(--sab, 0px) + 12px)); display: flex; flex-direction: column; gap: 20px; overflow-y: auto">
<div style="display: flex; justify-content: space-between; align-items: center">
<a href="Main.dc.html" aria-label="Geri" style="width: 44px; height: 44px; border-radius: 14px; background: #232750; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.500" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
</a>
<h1 style="margin: 0; font-size: 24px; font-weight: 600">Profil</h1>
<a href="Settings.dc.html" aria-label="Ayarlar" style="width: 44px; height: 44px; border-radius: 14px; background: #232750; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5.500" stroke-width="3"></circle><circle cx="12" cy="12" r="8.500" stroke-width="3" stroke-linecap="butt" stroke-dasharray="3.340 3.340"></circle></svg>
</a>
</div>
<div style="display: flex; align-items: center; gap: 16px; padding: 16px; background: #232750; border-radius: 20px">
<div style="position: relative; width: 76px; height: 76px; flex-shrink: 0">
<div style="width: 76px; height: 76px; border-radius: 22px; background: {{bgColor}}; overflow: hidden">
<svg viewBox="0 0 200 200" width="76" height="76" role="img" aria-label="Avatar">
<sc-if value="{{ hairLong }}" hint-placeholder-val="{{ true }}">
<path d="M46 96C44 54 68 32 100 32C132 32 156 54 154 96Q160 136 140 166L60 166Q40 136 46 96Z" fill="{{hairHex}}"></path>
</sc-if>
<sc-if value="{{ hairBun }}" hint-placeholder-val="{{ false }}">
<circle cx="100" cy="25" r="15" fill="{{hairHex}}"></circle><circle cx="113" cy="17" r="7" fill="{{hairHex}}"></circle>
</sc-if>
<sc-if value="{{ hairWavyLong }}" hint-placeholder-val="{{ false }}">
<path d="M44 94C42 52 68 30 100 30C132 30 158 52 156 94Q164 116 152 128Q160 140 150 152Q158 164 144 180L56 180Q42 164 50 152Q40 140 48 128Q36 116 44 94Z" fill="{{hairHex}}"></path>
</sc-if>
<sc-if value="{{ hairWavyShort }}" hint-placeholder-val="{{ false }}">
<path d="M44 94C42 52 68 30 100 30C132 30 158 52 156 94Q162 108 152 116Q158 128 146 136L54 136Q42 128 48 116Q38 108 44 94Z" fill="{{hairHex}}"></path>
</sc-if>
<sc-if value="{{ hairPonytail }}" hint-placeholder-val="{{ false }}">
<path d="M118 38Q158 40 168 72Q176 104 162 136Q156 148 144 140Q156 112 150 80Q144 54 114 46Z" fill="{{hairHex}}"></path>
</sc-if>
<rect x="86" y="136" width="28" height="34" fill="{{skinShade}}"></rect>
<path d="M36 200c0-28 28-42 64-42s64 14 64 42z" fill="{{ clothHex }}"></path>

<circle cx="53" cy="100" r="{{earR}}" fill="{{skinHex}}"></circle><circle cx="147" cy="100" r="{{earR}}" fill="{{skinHex}}"></circle>
</sc-if>
<sc-if value="{{ earSivri }}" hint-placeholder-val="{{ false }}">
<path d="M44 92q-12-1-11 11q1 10 12 7q-5-8-3-18z" fill="{{skinHex}}"></path><path d="M156 92q12-1 11 11q-1 10-12 7q5-8 3-18z" fill="{{skinHex}}"></path>
</sc-if>
<rect x="{{faceX}}" y="{{faceY}}" width="{{faceW}}" height="{{faceH}}" rx="{{faceR}}" fill="{{skinHex}}"></rect>
<sc-if value="{{ showBeard }}" hint-placeholder-val="{{ false }}">
<path d="M56 104c0 34 18 50 44 50s44-16 44-50c-6 14-14 20-22 20c-6-6-14-8-22-8s-16 2-22 8c-8 0-16-6-22-20z" fill="{{hairHex}}" opacity="{{beardOpacity}}"></path>
<ellipse cx="100" cy="131" rx="15" ry="8" fill="{{skinHex}}"></ellipse>
</sc-if>
<sc-if value="{{ hairCap }}" hint-placeholder-val="{{ true }}">
<path d="M50 90c-3-36 18-58 50-58s53 22 50 58c-10-19-27-27-50-27s-40 8-50 27z" fill="{{hairHex}}"></path>
</sc-if>
<sc-if value="{{ hairCurly }}" hint-placeholder-val="{{ false }}">
<g fill="{{hairHex}}">
<circle cx="52" cy="80" r="13"></circle><circle cx="62" cy="62" r="16"></circle><circle cx="80" cy="48" r="17"></circle><circle cx="100" cy="44" r="18"></circle><circle cx="120" cy="48" r="17"></circle><circle cx="138" cy="62" r="16"></circle><circle cx="148" cy="80" r="13"></circle><circle cx="70" cy="36" r="14"></circle><circle cx="100" cy="29" r="16"></circle><circle cx="130" cy="36" r="14"></circle>
</g>
</sc-if>
<sc-if value="{{ hairCurlyShort }}" hint-placeholder-val="{{ false }}">
<g fill="{{hairHex}}">
<circle cx="62" cy="85" r="10"></circle><circle cx="74" cy="68" r="12"></circle><circle cx="90" cy="56" r="13"></circle><circle cx="100" cy="52" r="13"></circle><circle cx="110" cy="56" r="13"></circle><circle cx="126" cy="68" r="12"></circle><circle cx="138" cy="85" r="10"></circle><circle cx="82" cy="44" r="10"></circle><circle cx="100" cy="40" r="11"></circle><circle cx="118" cy="44" r="10"></circle>
</g>
</sc-if>
<path d="{{ browD }}" fill="none" stroke="{{ hairHex }}" stroke-width="{{ browSw }}" stroke-linecap="round"></path>
<ellipse cx="80" cy="100" rx="{{eyeRx}}" ry="{{eyeRy}}" fill="#FFFFFF"></ellipse>
<ellipse cx="120" cy="100" rx="{{eyeRx}}" ry="{{eyeRy}}" fill="#FFFFFF"></ellipse>
<circle cx="80" cy="100" r="{{irisR}}" fill="{{eyeHex}}"></circle>
<circle cx="120" cy="100" r="{{irisR}}" fill="{{eyeHex}}"></circle>
<circle cx="80" cy="100" r="2.200" fill="#171A36"></circle>
<circle cx="120" cy="100" r="2.200" fill="#171A36"></circle>
<sc-if value="{{ lashes }}" hint-placeholder-val="{{ true }}">
<path d="M70 93l-4-4M130 93l4-4M74 90l-2-5M126 90l2-5" fill="none" stroke="#171A36" stroke-width="2.200" stroke-linecap="round"></path>
</sc-if>
<path d="{{noseD}}" fill="none" stroke="{{skinShade}}" stroke-width="{{noseSw}}" stroke-linecap="round"></path>
<path d="{{lipD}}" fill="{{lipFill}}" stroke="{{lipStroke}}" stroke-width="{{lipSw}}" stroke-linecap="round"></path>
<sc-if value="{{ showMoustache }}" hint-placeholder-val="{{ false }}">
<path d="M80 124q10-9 20-3q10-6 20 3q-10 4-20 0q-10 4-20 0z" fill="{{hairHex}}"></path>
</sc-if>
<sc-if value="{{ showGlasses }}" hint-placeholder-val="{{ false }}">
<g data-color-stroke="glasses" stroke="{{ gFrame }}" stroke-width="3.500" stroke-linecap="round">
<rect x="{{gX1}}" y="{{gY}}" width="{{gW}}" height="{{gH}}" rx="{{gR}}" fill="{{gFill}}" fill-opacity="{{gFillOpacity}}"></rect>
<rect x="{{gX2}}" y="{{gY}}" width="{{gW}}" height="{{gH}}" rx="{{gR}}" fill="{{gFill}}" fill-opacity="{{gFillOpacity}}"></rect>
<path d="M95 98h10M64 96l-10-3M136 96l10-3" fill="none"></path>
</g>
</sc-if>
<sc-if value="{{ hasHeadphones }}" hint-placeholder-val="{{ false }}">
<path d="M50 88q0-42 50-42q50 0 50 42" fill="none" stroke="#232750" stroke-width="8" stroke-linecap="round"></path><rect x="38" y="84" width="18" height="28" rx="9" fill="#232750"></rect><rect x="144" y="84" width="18" height="28" rx="9" fill="#232750"></rect>
</sc-if>
<sc-if value="{{ hasHat }}" hint-placeholder-val="{{ false }}">
<path d="M48 70q4-46 52-46q48 0 52 46q2 10-8 10H56q-10 0-8-10z" fill="#3B7DD8"></path><rect x="44" y="70" width="112" height="13" rx="6.5" fill="#2A5A9E"></rect>
</sc-if>
<sc-if value="{{ hasClip }}" hint-placeholder-val="{{ false }}">
<rect x="112" y="34" width="16" height="8" rx="3" fill="#FF7AA8" transform="rotate(-20 120 38)"></rect>
</sc-if>
<sc-if value="{{ hasEarring }}" hint-placeholder-val="{{ false }}">
<circle cx="52" cy="112" r="3" fill="#FFD35C"></circle><circle cx="148" cy="112" r="3" fill="#FFD35C"></circle>
</sc-if>
<sc-if value="{{ hasPiercing }}" hint-placeholder-val="{{ false }}">
<circle cx="108" cy="118" r="2" fill="#C9CDE0"></circle>
</sc-if>
<sc-if value="{{ hasScarf }}" hint-placeholder-val="{{ false }}">
<path d="M70 162q30 16 60 0l6 16q-33 18-72 0z" fill="#B5452A"></path>
</sc-if>
<sc-if value="{{ hasNecklace }}" hint-placeholder-val="{{ false }}">
<path d="M80 168q20 10 40 0" fill="none" stroke="#D9A441" stroke-width="2.500" stroke-linecap="round"></path><circle cx="100" cy="176" r="4" fill="#D9A441"></circle>
</sc-if>
</svg>
</div>
<sc-if value="{{ hasPet }}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; right: -3px; bottom: -3px; width: 26px; height: 26px; box-sizing: border-box; border: 2.5px solid #232750; border-radius: 50%; background: {{petColor}}; display: flex; align-items: center; justify-content: center; font-size: 14px; line-height: 1">{{ petEmoji }}</div>
</sc-if>
</div>
<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
<div style="font-size: 22px; font-weight: 600; line-height: 1.1">{{ playerName }}</div>
<div style="font-size: 14px; font-weight: 500; color: #3DD6C3">{{ tierLabel }}</div>
</div>
<a href="Avatar.dc.html" aria-label="Avatarı düzenle" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 14px; background: #2E3366; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z"></path><path d="M13 7l4 4"></path></svg>
</a>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
<div style="height: 84px; background: #232750; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px">
<div style="font-size: 26px; font-weight: 600; line-height: 1; color: #FFD35C">{{ totalStars }}</div>
<div style="font-size: 13px; font-weight: 500; color: #B9BDE6">Yıldız</div>
</div>
<div style="height: 84px; background: #232750; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px">
<div style="font-size: 26px; font-weight: 600; line-height: 1">{{ completedCount }}</div>
<div style="font-size: 13px; font-weight: 500; color: #B9BDE6">Biten seviye</div>
</div>
<div style="height: 84px; background: #232750; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px">
<div style="font-size: 26px; font-weight: 600; line-height: 1">{{ streak }}</div>
<div style="font-size: 13px; font-weight: 500; color: #B9BDE6">Gün serisi</div>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; justify-content: space-between; height: 24px">
<h2 style="margin: 0; font-size: 18px; font-weight: 600">Rozetler</h2>
<a href="Badges.dc.html" style="min-height: 44px; padding-left: 16px; display: flex; align-items: center; font-size: 15px; font-weight: 500; color: #3DD6C3">Tümünü gör</a>
</div>
<div onclick="{{ goBadges }}" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; cursor: pointer">
<sc-for list="{{ badges }}" as="bd" hint-placeholder-count="4">
<div style="display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; text-align: center">
<div style="width: 60px; height: 60px; box-sizing: border-box; padding-bottom: 5px; background: {{bd.bg}}; border-radius: 18px; box-shadow: {{bd.shadow}}; border: {{bd.border}}; color: {{bd.fg}}; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.400" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{bd.icon}}"></path></svg>
</div>
<span>{{ bd.name }}</span>
</div>
</sc-for>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 18px; font-weight: 600">İlerleme</h2>
<div style="display: flex; flex-direction: column; gap: 14px; padding: 16px; background: #232750; border-radius: 18px">
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; font-size: 15px; font-weight: 500"><span>{{ pkgLabel }}</span><span style="color: #B9BDE6">{{ pkgDone }} / {{ pkgTotal }}</span></div>
<div style="height: 10px; background: #171A36; border-radius: 5px; overflow: hidden"><div style="width: {{ pkgPct }}%; height: 10px; background: #3DD6C3; border-radius: 5px"></div></div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; font-size: 15px; font-weight: 500"><span>Yıldızlar</span><span style="color: #B9BDE6">{{ starDone }} / {{ starTotal }}</span></div>
<div style="height: 10px; background: #171A36; border-radius: 5px; overflow: hidden"><div style="width: {{ starPct }}%; height: 10px; background: #FFD35C; border-radius: 5px"></div></div>
</div>
</div>
</div>
<div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<a href="Themes.dc.html" style="height: 52px; background: #232750; border-radius: 18px; color: #FFFFFF; text-decoration: none; font-size: 17px; font-weight: 500; display: flex; align-items: center; justify-content: center">Temalarım</a>
<a href="Leaderboard.dc.html" style="height: 52px; background: #232750; border-radius: 18px; color: #FFFFFF; text-decoration: none; font-size: 17px; font-weight: 500; display: flex; align-items: center; justify-content: center">Rekorlarım</a>
</div>
</div>
</div>
