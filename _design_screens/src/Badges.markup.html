
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #171A36; color: #FFFFFF; font-family: 'Fredoka', system-ui, sans-serif; padding: 56px 20px 32px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; align-items: center; justify-content: space-between">
<a href="Profile.dc.html" aria-label="Geri" style="width: 44px; height: 44px; border-radius: 14px; background: #232750; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.500" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
</a>
<h1 style="margin: 0; font-size: 24px; font-weight: 600">Rozetler</h1>
<div style="height: 44px; padding: 0 14px; background: #232750; border-radius: 22px; font-size: 17px; font-weight: 600; display: flex; align-items: center">{{ earnedCount }} / {{ total }}</div>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
<sc-for list="{{ badges }}" as="b" hint-placeholder-count="9">
<div style="height: 168px; box-sizing: border-box; padding: 14px 8px; background: #232750; border-radius: 18px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center">
<div style="width: 60px; height: 60px; flex-shrink: 0; box-sizing: border-box; padding-bottom: {{b.pad}}; border-radius: 18px; background: {{b.bg}}; box-shadow: {{b.shadow}}; border: {{b.border}}; color: {{b.fg}}; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.400" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{b.icon}}"></path></svg>
</div>
<div style="font-size: 14px; font-weight: 600; line-height: 1.15">{{ b.name }}</div>
<div style="font-size: 12px; line-height: 1.2; color: #B9BDE6">{{ b.how }}</div>
<div style="margin-top: auto; font-size: 13px; font-weight: 600; color: {{b.statusFg}}">{{ b.status }}</div>
</div>
</sc-for>
</div>
</div>
