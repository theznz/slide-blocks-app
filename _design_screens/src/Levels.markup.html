
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #171A36; color: #FFFFFF; font-family: 'Fredoka', system-ui, sans-serif; padding: 56px 20px 32px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; justify-content: space-between; align-items: center">
<a href="Main.dc.html" aria-label="Geri" style="width: 44px; height: 44px; border-radius: 14px; background: #232750; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.500" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
</a>
<h1 style="margin: 0; font-size: 24px; font-weight: 600">Seviyeler</h1>
<div style="display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 14px; background: #232750; border-radius: 22px; font-size: 17px; font-weight: 600">
<svg viewBox="0 0 24 24" width="18" height="18" fill="#FFD35C" aria-hidden="true"><path d="M12 2.5l2.9 6.2 6.6.8-4.9 4.6 1.3 6.6L12 17.4l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z"></path></svg>
<span>{{ stars }}</span>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{ tabs }}" as="tb" hint-placeholder-count="4">
<button onclick="{{ tb.pick }}" style="height: 44px; border: 0; border-radius: 22px; background: {{tb.bg}}; color: {{tb.fg}}; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer">{{ tb.label }}</button>
</sc-for>
</div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px">
<sc-for list="{{ levels }}" as="lv" hint-placeholder-count="8">
<div style="height: 78px">
<sc-if value="{{ lv.open }}" hint-placeholder-val="{{ true }}">
<button onclick="{{ lv.pick }}" style="width: 100%; height: 78px; box-sizing: border-box; padding-bottom: 5px; border: 0; border-radius: 16px; background: {{lv.bg}}; box-shadow: inset 0 -5px 0 {{lv.edge}}; color: {{lv.fg}}; font-family: inherit; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; cursor: pointer">
<span style="font-size: 24px; font-weight: 600; line-height: 1">{{ lv.n }}</span>
<span style="display: flex; gap: 4px">
<span style="width: 9px; height: 9px; border-radius: 50%; background: {{lv.s1}}"></span>
<span style="width: 9px; height: 9px; border-radius: 50%; background: {{lv.s2}}"></span>
<span style="width: 9px; height: 9px; border-radius: 50%; background: {{lv.s3}}"></span>
</span>
</button>
</sc-if>
<sc-if value="{{ lv.locked }}" hint-placeholder-val="{{ false }}">
<div style="height: 78px; box-sizing: border-box; border-radius: 16px; border: 2px solid #2E3366; color: #8D93C9; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px">
<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="3"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
<span style="font-size: 15px; font-weight: 500">{{ lv.n }}</span>
</div>
</sc-if>
</div>
</sc-for>
</div>
<div style="margin-top: auto; display: flex; align-items: center; justify-content: center; gap: 16px; font-size: 14px; color: #B9BDE6">
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; border-radius: 4px; background: #2E3366"></span>Tamamlandı</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; border-radius: 4px; background: #FF9F45"></span>Sıradaki</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; box-sizing: border-box; border-radius: 4px; border: 2px solid #2E3366"></span>Kilitli</span>
</div>
</div>
