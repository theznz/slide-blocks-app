
<div style="position: relative; overflow: hidden; width: 390px; height: 100%; box-sizing: border-box; background: #171A36; color: #FFFFFF; font-family: 'Baloo 2', system-ui, sans-serif; padding: max(56px, calc(var(--sat, 0px) + 14px)) 20px max(32px, calc(var(--sab, 0px) + 12px)); display: flex; flex-direction: column; justify-content: space-between; overflow-y: auto">
<div style="position: absolute; left: -18px; top: 96px; width: 84px; height: 40px; background: #6C8CFF; border-radius: 12px; box-shadow: inset 0 -6px 0 #4865D6; transform: rotate(-18deg)"></div>
<div style="position: absolute; right: -10px; top: 150px; width: 40px; height: 96px; background: #3DD6C3; border-radius: 12px; box-shadow: inset 0 -6px 0 #25A898; transform: rotate(14deg)"></div>
<div style="position: absolute; right: 56px; top: 70px; width: 40px; height: 40px; background: #FF7AA8; border-radius: 12px; box-shadow: inset 0 -6px 0 #D4527F; transform: rotate(24deg)"></div>
<div style="position: absolute; left: 34px; top: 250px; width: 36px; height: 36px; background: #FFD35C; border-radius: 10px; box-shadow: inset 0 -5px 0 #D9A92F; transform: rotate(-30deg)"></div>
<div style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 24px; padding-top: 72px">
<div style="display: flex; align-items: flex-end; gap: 6px">
<svg viewBox="0 0 24 24" width="72" height="72" fill="{{star1}}" stroke="{{star1Stroke}}" stroke-width="1" stroke-dasharray="{{star1Dash}}" stroke-linejoin="round" aria-hidden="true" style="transform: rotate(-12deg)"><path d="M12 2.5l2.9 6.2 6.6.8-4.9 4.6 1.3 6.6L12 17.4l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z"></path></svg>
<svg viewBox="0 0 24 24" width="104" height="104" fill="{{star2}}" stroke="{{star2Stroke}}" stroke-width="1" stroke-dasharray="{{star2Dash}}" stroke-linejoin="round" aria-hidden="true" style="margin-bottom: 20px"><path d="M12 2.5l2.9 6.2 6.6.8-4.9 4.6 1.3 6.6L12 17.4l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z"></path></svg>
<svg viewBox="0 0 24 24" width="72" height="72" fill="{{star3}}" stroke="{{star3Stroke}}" stroke-width="1" stroke-dasharray="{{star3Dash}}" stroke-linejoin="round" aria-hidden="true" style="transform: rotate(12deg)"><path d="M12 2.5l2.9 6.2 6.6.8-4.9 4.6 1.3 6.6L12 17.4l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z"></path></svg>
</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
<h1 style="margin: 0; font-size: 40px; font-weight: 700; line-height: 1.05; text-align: center">Harika!</h1>
<div style="font-size: 18px; font-weight: 500; color: #B9BDE6">Seviye {{ levelIndex }} tamamlandı</div>
</div>
</div>
<div style="position: relative; display: flex; flex-direction: column; gap: 12px">
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
<div style="height: 76px; background: #232750; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px">
<div style="font-size: 13px; font-weight: 500; color: #B9BDE6">Hamle</div>
<div style="font-size: 26px; font-weight: 600; line-height: 1">{{ moves }}</div>
</div>
<div style="height: 76px; background: #232750; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px">
<div style="font-size: 13px; font-weight: 500; color: #B9BDE6">Hedef</div>
<div style="font-size: 26px; font-weight: 600; line-height: 1; color: #FFD35C">{{ par }}</div>
</div>
<div style="height: 76px; background: #232750; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px">
<div style="font-size: 13px; font-weight: 500; color: #B9BDE6">Süre</div>
<div style="font-size: 26px; font-weight: 600; line-height: 1">{{ timeLabel }}</div>
</div>
</div>
<div style="padding: 14px 16px; background: #232750; border-radius: 16px; display: flex; align-items: center; gap: 12px; font-size: 15px; line-height: 1.3">
<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#FFD35C" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M9 18h6M10 21h4"></path><path d="M12 3a6 6 0 0 0-3.500 10.900c.6.5 1 1.200 1 2.100h5c0-.9.4-1.600 1-2.100A6 6 0 0 0 12 3z"></path></svg>
<span>{{ tip }}</span>
</div>
</div>
<div style="position: relative; display: flex; flex-direction: column; gap: 12px">
<button onclick="{{ next }}" style="height: 72px; box-sizing: border-box; padding-bottom: 6px; border: 0; background: #FF9F45; border-radius: 22px; box-shadow: inset 0 -6px 0 #D9772A; color: #171A36; font-family: inherit; text-decoration: none; font-size: 24px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer">
<span>{{ nextLabel }}</span>
<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16M14 6l6 6-6 6"></path></svg>
</button>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<button onclick="{{ replay }}" style="height: 56px; border: 0; background: #232750; border-radius: 18px; color: #FFFFFF; font-family: inherit; text-decoration: none; font-size: 17px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer">
<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.600-5.900"></path><path d="M20 4v5h-5"></path></svg>
<span>Tekrar oyna</span>
</button>
<a href="Main.dc.html" style="height: 56px; background: #232750; border-radius: 18px; color: #FFFFFF; text-decoration: none; font-size: 17px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 8px">
<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7"></path><path d="M6 10v10h12V10"></path></svg>
<span>Ana ekran</span>
</a>
</div>
</div>
</div>
