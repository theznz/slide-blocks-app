
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #171A36; color: #FFFFFF; font-family: 'Baloo 2', system-ui, sans-serif; padding: 56px 20px 32px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; justify-content: space-between; align-items: center">
<a href="Main.dc.html" aria-label="Geri" style="width: 44px; height: 44px; border-radius: 14px; background: #232750; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.500" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
</a>
<h1 style="margin: 0; font-size: 24px; font-weight: 600">Temalar</h1>
<a href="Shop.dc.html" style="display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 14px; background: #232750; border-radius: 22px; font-size: 17px; font-weight: 600; color: #FFFFFF; text-decoration: none">
<svg viewBox="0 0 24 24" width="18" height="18" fill="#FFD35C" aria-hidden="true"><path d="M12 2.5l2.9 6.2 6.6.8-4.9 4.6 1.3 6.6L12 17.4l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z"></path></svg>
<span>{{ stars }}</span>
</a>
</div>
<div style="height: 150px; box-sizing: border-box; padding: 16px; background: #232750; border-radius: 20px; display: flex; align-items: center; justify-content: space-between; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 4px">
<div style="font-size: 13px; font-weight: 500; color: #B9BDE6">Önizleme</div>
<div style="font-size: 26px; font-weight: 600; line-height: 1.1">{{ pickedName }}</div>
<div style="font-size: 14px; color: #B9BDE6">{{ pickedStatus }}</div>
</div>
<div style="width: 188px; flex-shrink: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: repeat(2, 44px); gap: 4px">
<div style="grid-column: 1 / span 2; grid-row: 1; box-sizing: border-box; padding-bottom: 5px; background: {{c1}}; border-radius: 11px; box-shadow: inset 0 -5px 0 rgba(0,0,0,0.22); color: #171A36; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16M14 6l6 6-6 6"></path></svg>
</div>
<div style="grid-column: 3; grid-row: 1 / span 2; background: {{c2}}; border-radius: 11px; box-shadow: inset 0 -5px 0 rgba(0,0,0,0.22)"></div>
<div style="grid-column: 4; grid-row: 1 / span 2; background: {{c3}}; border-radius: 11px; box-shadow: inset 0 -5px 0 rgba(0,0,0,0.22)"></div>
<div style="grid-column: 1 / span 2; grid-row: 2; background: {{c3}}; border-radius: 11px; box-shadow: inset 0 -5px 0 rgba(0,0,0,0.22)"></div>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<sc-for list="{{ themes }}" as="t" hint-placeholder-count="6">
<button onClick="{{ t.pick }}" aria-pressed="{{ t.pressed }}" style="height: 120px; box-sizing: border-box; padding: 14px; border: 0; border-radius: 18px; background: #232750; box-shadow: {{t.ring}}; color: #FFFFFF; font-family: inherit; text-align: left; display: flex; flex-direction: column; justify-content: space-between; cursor: pointer">
<span style="display: flex; gap: 6px">
<span style="width: 36px; height: 36px; border-radius: 10px; background: {{t.c1}}; box-shadow: inset 0 -5px 0 rgba(0,0,0,0.22)"></span>
<span style="width: 36px; height: 36px; border-radius: 10px; background: {{t.c2}}; box-shadow: inset 0 -5px 0 rgba(0,0,0,0.22)"></span>
<span style="width: 36px; height: 36px; border-radius: 10px; background: {{t.c3}}; box-shadow: inset 0 -5px 0 rgba(0,0,0,0.22)"></span>
</span>
<span style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 18px; font-weight: 600; line-height: 1.1">{{ t.name }}</span>
<span style="font-size: 14px; font-weight: 500; color: {{t.statusColor}}">{{ t.status }}</span>
</span>
</button>
</sc-for>
</div>
<button onclick="{{ apply }}" style="margin-top: auto; height: 68px; box-sizing: border-box; padding-bottom: 6px; border: 0; border-radius: 22px; background: #FF9F45; box-shadow: inset 0 -6px 0 #D9772A; color: #171A36; font-family: inherit; font-size: 22px; font-weight: 700; cursor: pointer">{{ cta }}</button>
</div>
