
<div style="width: 390px; height: 100%; box-sizing: border-box; background: #171A36; color: #FFFFFF; font-family: 'Baloo 2', system-ui, sans-serif; padding: max(56px, calc(var(--sat, 0px) + 14px)) 20px max(32px, calc(var(--sab, 0px) + 12px)); display: flex; flex-direction: column; justify-content: space-between; overflow-y: auto">
<div style="display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; justify-content: space-between; align-items: center">
<a href="Levels.dc.html" aria-label="Seviyelere dön" style="width: 44px; height: 44px; border-radius: 14px; background: #232750; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.500" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
</a>
<div style="display: flex; flex-direction: column; align-items: center; gap: 2px">
<h1 style="margin: 0; font-size: 24px; font-weight: 600; line-height: 1.1">Seviye {{ levelIndex }}</h1>
<div style="font-size: 14px; font-weight: 500; color: #3DD6C3">{{ tierName }}</div>
</div>
<div style="display: flex; align-items: center; gap: 8px">
<button onclick="{{ toggleMute }}" aria-label="Sesi aç/kapat" style="width: 44px; height: 44px; border: 0; border-radius: 14px; background: #232750; color: #FFFFFF; font-family: inherit; display: flex; align-items: center; justify-content: center; cursor: pointer">
<sc-if value="{{ muted }}" hint-placeholder-val="{{ false }}">
<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H3v6h3l5 4V5z"></path><path d="M16 9l6 6M22 9l-6 6"></path></svg>
</sc-if>
<sc-if value="{{ unmuted }}" hint-placeholder-val="{{ true }}">
<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H3v6h3l5 4V5z"></path><path d="M15.500 8.500a5 5 0 0 1 0 7M18.500 6a9 9 0 0 1 0 12"></path></svg>
</sc-if>
</button>
<a href="Pause.dc.html" aria-label="Duraklat" style="width: 44px; height: 44px; border-radius: 14px; background: #232750; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M9 6v12M15 6v12"></path></svg>
</a>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
<div style="height: 68px; background: #232750; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
<div style="font-size: 13px; font-weight: 500; color: #B9BDE6">Hamle</div>
<div style="font-size: 24px; font-weight: 600; line-height: 1">{{ moves }}</div>
</div>
<div style="height: 68px; background: #232750; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
<div style="font-size: 13px; font-weight: 500; color: #B9BDE6">Hedef</div>
<div style="font-size: 24px; font-weight: 600; line-height: 1; color: #FFD35C">{{ par }}</div>
</div>
<div style="height: 68px; background: #232750; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
<div style="font-size: 13px; font-weight: 500; color: #B9BDE6">Süre</div>
<div style="font-size: 24px; font-weight: 600; line-height: 1">{{ timeLabel }}</div>
</div>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 14px">
<div style="position: relative; width: 350px; height: 350px; {{boardBg}} border-radius: 20px">
<sc-for list="{{ blocks }}" as="b" hint-placeholder-count="10">
<div data-id="{{ b.id }}" onpointerdown="{{ startDrag }}" class="{{ b.cls }}" style="{{ b.style }}">
<sc-if value="{{ b.target }}" hint-placeholder-val="{{ true }}">
<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: {{b.arrowColor}}; transform: rotate({{b.arrowRot}}deg)"><path d="M4 12h16M14 6l6 6-6 6"></path></svg>
</sc-if>
<sc-if value="{{ b.wall }}" hint-placeholder-val="{{ false }}">
<svg viewBox="0 0 52 52" width="52" height="52" fill="none" aria-hidden="true"><path d="M8 18h36M8 34h36M20 6v12M32 18v16M20 34v12" stroke="#4A4F86" stroke-width="2.500" stroke-linecap="round"></path></svg>
</sc-if>
</div>
</sc-for>
<div style="position: absolute; border-radius: 4px; {{ exitStyle }}"></div>
</div>
<div style="display: flex; align-items: center; justify-content: flex-end; gap: 8px; font-size: 14px; font-weight: 500; color: #B9BDE6">
<span>Oklu bloğu çıkışa ulaştır</span>
<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="{{ targetHex }}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform: rotate({{ arrowRot }}deg)"><path d="M4 12h16M14 6l6 6-6 6"></path></svg>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
<button onclick="{{ undo }}" style="height: 76px; border: 0; border-radius: 18px; background: #232750; color: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 500; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; cursor: pointer">
<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 5L4 9l4 4"></path><path d="M4 9h10a6 6 0 0 1 0 12h-3"></path></svg>
<span>Geri al</span>
</button>
<button onclick="{{ hint }}" style="position: relative; height: 76px; box-sizing: border-box; padding-bottom: 6px; border: 0; border-radius: 18px; background: #FFD35C; box-shadow: inset 0 -6px 0 #D9A92F; color: #171A36; font-family: inherit; font-size: 15px; font-weight: 600; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; cursor: pointer">
<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4"></path><path d="M12 3a6 6 0 0 0-3.500 10.900c.6.5 1 1.200 1 2.100h5c0-.9.4-1.600 1-2.100A6 6 0 0 0 12 3z"></path></svg>
<span>İpucu</span>
<span style="position: absolute; top: -8px; right: -6px; min-width: 26px; height: 26px; box-sizing: border-box; padding: 0 6px; border-radius: 13px; background: #FFFFFF; color: #171A36; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center">{{ hints }}</span>
</button>
<button onclick="{{ restart }}" style="height: 76px; border: 0; border-radius: 18px; background: #232750; color: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 500; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; cursor: pointer">
<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.600-5.900"></path><path d="M20 4v5h-5"></path></svg>
<span>Yeniden</span>
</button>
</div>
</div>
</div>
