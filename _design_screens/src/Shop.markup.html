
<div style="position: relative; width: 390px; height: 100%; box-sizing: border-box; background: #171A36; color: #FFFFFF; font-family: 'Baloo 2', system-ui, sans-serif; padding: 56px 20px 32px; padding: max(56px, calc(var(--sat, 0px) + 14px)) 20px max(32px, calc(var(--sab, 0px) + 12px)); display: flex; flex-direction: column; gap: 20px; overflow-y: auto">
<div style="display: flex; align-items: center; justify-content: space-between">
<a href="Main.dc.html" aria-label="Geri" style="width: 44px; height: 44px; border-radius: 14px; background: #232750; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.500" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
</a>
<h1 style="margin: 0; font-size: 24px; font-weight: 600">Mağaza</h1>
<div style="display: flex; align-items: center; gap: 10px">
<div style="display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 12px; background: #232750; border-radius: 20px; font-size: 15px; font-weight: 600">
<svg viewBox="0 0 24 24" width="16" height="16" fill="#FFD35C" aria-hidden="true"><path d="M12 2.5l2.9 6.2 6.6.8-4.9 4.6 1.3 6.6L12 17.4l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z"/></svg>
<span>{{ stars }}</span>
</div>
<div style="display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 12px; background: #232750; border-radius: 20px; font-size: 15px; font-weight: 600">
<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#FFD35C" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.500 10.900c.6.5 1 1.200 1 2.100h5c0-.9.4-1.600 1-2.100A6 6 0 0 0 12 3z"/></svg>
<span>{{ hints }}</span>
</div>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 18px; font-weight: 600">İpucu paketleri</h2>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
<button onclick="{{ buy5 }}" style="border: 0; color: inherit; font-family: inherit; cursor: pointer; padding: 14px 8px 10px; background: #232750; border-radius: 18px; display: flex; flex-direction: column; align-items: center; gap: 8px">
<div style="font-size: 30px; font-weight: 700; line-height: 1; color: #FFD35C">5</div>
<div style="font-size: 14px; font-weight: 500; color: #B9BDE6">ipucu</div>
<span style="align-self: stretch; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 14px; background: #2E3366; color: #FFFFFF; font-size: 14px; font-weight: 600">25 ★</span>
</button>
<button onclick="{{ buy15 }}" style="border: 0; color: inherit; font-family: inherit; cursor: pointer; position: relative; padding: 14px 8px 10px; background: #232750; border-radius: 18px; box-shadow: 0 0 0 3px #FFD35C; display: flex; flex-direction: column; align-items: center; gap: 8px">
<div style="position: absolute; top: -12px; padding: 2px 10px; border-radius: 10px; background: #FFD35C; color: #171A36; font-size: 12px; font-weight: 600">En çok alınan</div>
<div style="font-size: 30px; font-weight: 700; line-height: 1; color: #FFD35C">15</div>
<div style="font-size: 14px; font-weight: 500; color: #B9BDE6">ipucu</div>
<span style="align-self: stretch; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 14px; background: #FFD35C; color: #171A36; font-size: 14px; font-weight: 600">60 ★</span>
</button>
<button onclick="{{ buy40 }}" style="border: 0; color: inherit; font-family: inherit; cursor: pointer; padding: 14px 8px 10px; background: #232750; border-radius: 18px; display: flex; flex-direction: column; align-items: center; gap: 8px">
<div style="font-size: 30px; font-weight: 700; line-height: 1; color: #FFD35C">40</div>
<div style="font-size: 14px; font-weight: 500; color: #B9BDE6">ipucu</div>
<span style="align-self: stretch; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 14px; background: #2E3366; color: #FFFFFF; font-size: 14px; font-weight: 600">140 ★</span>
</button>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 18px; font-weight: 600">Ücretsiz</h2>
<div style="display: flex; align-items: center; gap: 14px; padding: 14px 16px; background: #232750; border-radius: 18px">
<div style="width: 48px; height: 48px; flex-shrink: 0; border-radius: 14px; background: #3DD6C3; color: #171A36; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9.500v5l4.500-2.500z"/></svg>
</div>
<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 17px; font-weight: 600">Reklam izle</div>
<div style="font-size: 14px; color: #B9BDE6">1 ipucu kazan</div>
</div>
<button onclick="{{ watchAd }}" style="height: 44px; padding: 0 18px; border: 0; border-radius: 14px; background: #3DD6C3; color: #171A36; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer">{{ watchLabel }}</button>
</div>
<div style="display: flex; align-items: center; gap: 14px; padding: 14px 16px; background: #232750; border-radius: 18px">
<div style="width: 48px; height: 48px; flex-shrink: 0; border-radius: 14px; background: #FFD35C; color: #171A36; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9.500v5l4.500-2.500z"/></svg>
</div>
<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 17px; font-weight: 600">Reklam izle</div>
<div style="font-size: 14px; color: #B9BDE6">6 yıldız kazan</div>
</div>
<button onclick="{{ watchAdStars }}" style="height: 44px; padding: 0 18px; border: 0; border-radius: 14px; background: #FFD35C; color: #171A36; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer">{{ watchStarsLabel }}</button>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 18px; font-weight: 600">Reklamsız oyna</h2>
<div style="display: flex; align-items: center; gap: 14px; padding: 14px 16px; background: #232750; border-radius: 18px">
<div style="width: 48px; height: 48px; flex-shrink: 0; border-radius: 14px; background: #FF7AA8; color: #171A36; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M6 6l12 12"/></svg>
</div>
<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 17px; font-weight: 600">Reklamları kaldır</div>
<div style="font-size: 14px; color: #B9BDE6">Tek seferlik, yıldızla</div>
</div>
<button onclick="{{ noAds }}" style="height: 44px; padding: 0 14px; border: 0; border-radius: 14px; background: #2E3366; color: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer">200 ★</button>
</div>
</div>
<div style="margin-top: auto; display: flex; flex-direction: column; align-items: center; gap: 4px">
<a href="Themes.dc.html" style="min-height: 44px; display: flex; align-items: center; font-size: 15px; font-weight: 500; color: #FFFFFF">Temalar yıldızla açılır · Temalara git</a>
<button onclick="{{ restore }}" style="min-height: 44px; border: 0; background: transparent; color: #B9BDE6; font-family: inherit; font-size: 14px; font-weight: 500; text-decoration: underline; cursor: pointer">Satın alımları geri yükle</button>
</div>
<sc-if value="{{ hasConfirm }}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; top: 0; right: 0; bottom: 0; left: 0; background: rgba(14,16,36,0.78); display: flex; align-items: center; justify-content: center; padding: 0 20px">
<div style="width: 100%; box-sizing: border-box; padding: 24px 20px 20px; background: #232750; border-radius: 24px; display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center">
<div style="width: 64px; height: 64px; box-sizing: border-box; padding-bottom: 5px; background: #FFD35C; border-radius: 20px; box-shadow: inset 0 -5px 0 #D9A92F; color: #171A36; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.500 10.900c.6.5 1 1.200 1 2.100h5c0-.9.4-1.600 1-2.100A6 6 0 0 0 12 3z"/></svg>
</div>
<div style="font-size: 20px; font-weight: 600">Emin misin?</div>
<div style="font-size: 15px; line-height: 1.4; color: #B9BDE6">{{ confirmText }}</div>
<div style="width: 100%; display: flex; flex-direction: column; gap: 10px">
<button onclick="{{ confirmYes }}" style="height: 52px; border: 0; border-radius: 16px; background: #FF9F45; box-shadow: inset 0 -5px 0 #D9772A; color: #171A36; font-family: inherit; font-size: 17px; font-weight: 600; cursor: pointer">Evet, satın al</button>
<button onclick="{{ confirmNo }}" style="height: 48px; border: 0; border-radius: 16px; background: #2E3366; color: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 500; cursor: pointer">Vazgeç</button>
</div>
</div>
</div>
</sc-if>
</div>
