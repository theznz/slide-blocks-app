
<div style="width: 390px; height: 100%; box-sizing: border-box; background: #171A36; color: #FFFFFF; font-family: 'Baloo 2', system-ui, sans-serif; padding: 56px 20px 32px; padding: max(56px, calc(var(--sat, 0px) + 14px)) 20px max(32px, calc(var(--sab, 0px) + 12px)); display: flex; flex-direction: column; gap: 20px; overflow-y: auto">
<div style="display: flex; align-items: center; gap: 16px">
<a href="Profile.dc.html" aria-label="Geri" style="width: 44px; height: 44px; border-radius: 14px; background: #232750; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.500" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
</a>
<h1 style="margin: 0; font-size: 24px; font-weight: 600">Rekorlarım</h1>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{ tabs }}" as="tb" hint-placeholder-count="2">
<button onClick="{{ tb.pick }}" aria-pressed="{{ tb.pressed }}" style="height: 44px; border: 0; border-radius: 22px; background: {{tb.bg}}; color: {{tb.fg}}; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer">{{ tb.label }}</button>
</sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{ rows }}" as="r" hint-placeholder-count="7">
<div style="height: 62px; box-sizing: border-box; padding: 0 16px 0 12px; border-radius: 16px; background: #232750; display: flex; align-items: center; gap: 12px">
<div style="width: 38px; height: 38px; flex-shrink: 0; border-radius: 12px; background: {{r.badgeBg}}; color: {{r.badgeFg}}; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center">
<sc-if value="{{ r.isIcon }}" hint-placeholder-val="{{ true }}">
<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.400" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{r.icon}}"/></svg>
</sc-if>
<sc-if value="{{ r.isRank }}" hint-placeholder-val="{{ false }}">{{ r.rank }}</sc-if>
</div>
<div style="flex-grow: 1; min-width: 0; font-size: 17px; font-weight: 500">{{ r.name }}</div>
<div style="font-size: 17px; font-weight: 700; white-space: nowrap">{{ r.value }}</div>
</div>
</sc-for>
</div>
<div style="margin-top: auto; text-align: center; font-size: 14px; color: #B9BDE6">{{ footer }}</div>
</div>
