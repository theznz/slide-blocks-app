
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #171A36; color: #FFFFFF; font-family: 'Fredoka', system-ui, sans-serif; padding: 56px 20px 32px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; justify-content: space-between; align-items: center">
<a href="Profile.dc.html" aria-label="Geri" style="width: 44px; height: 44px; border-radius: 14px; background: #232750; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.500" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
</a>
<h1 style="margin: 0; font-size: 22px; font-weight: 600">Avatarını oluştur</h1>
<button onClick="{{ randomize }}" aria-label="Rastgele oluştur" style="width: 44px; height: 44px; border: 0; border-radius: 14px; background: #232750; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h4l8 10h6M3 17h4l2.500-3M14 8l1-1h6"></path><path d="M18 4l3 3-3 3M18 14l3 3-3 3"></path></svg>
</button>
</div>
<div style="align-self: center; position: relative; width: 190px; height: 190px; flex-shrink: 0">
<div style="width: 190px; height: 190px; border-radius: 50%; background: #2E3366; overflow: hidden">
<svg viewBox="0 0 200 200" width="190" height="190" role="img" aria-label="Avatar önizlemesi">
<sc-if value="{{ hairLong }}" hint-placeholder-val="{{ true }}">
<path d="M46 96c0-42 22-64 54-64s54 22 54 64v70H46z" fill="{{hairHex}}"></path>
</sc-if>
<sc-if value="{{ hairBun }}" hint-placeholder-val="{{ false }}">
<circle cx="100" cy="28" r="18" fill="{{hairHex}}"></circle>
</sc-if>
<rect x="86" y="136" width="28" height="34" fill="{{skinShade}}"></rect>
<path d="M36 200c0-28 28-42 64-42s64 14 64 42z" fill="#FF9F45"></path>
<circle cx="53" cy="100" r="9" fill="{{skinHex}}"></circle>
<circle cx="147" cy="100" r="9" fill="{{skinHex}}"></circle>
<rect x="{{faceX}}" y="{{faceY}}" width="{{faceW}}" height="{{faceH}}" rx="{{faceR}}" fill="{{skinHex}}"></rect>

</sc-if>
<sc-if value="{{ hairCurly }}" hint-placeholder-val="{{ false }}">

<ellipse cx="80" cy="100" rx="{{eyeRx}}" ry="{{eyeRy}}" fill="#FFFFFF"></ellipse>
<ellipse cx="120" cy="100" rx="{{eyeRx}}" ry="{{eyeRy}}" fill="#FFFFFF"></ellipse>
<circle cx="80" cy="100" r="{{irisR}}" fill="{{eyeHex}}"></circle>
<circle cx="120" cy="100" r="{{irisR}}" fill="{{eyeHex}}"></circle>
<circle cx="80" cy="100" r="2.200" fill="#171A36"></circle>
<circle cx="120" cy="100" r="2.200" fill="#171A36"></circle>
<sc-if value="{{ lashes }}" hint-placeholder-val="{{ true }}">
<path d="M70 93l-4-4M130 93l4-4M74 90l-2-5M126 90l2-5" fill="none" stroke="#171A36" stroke-width="2.200" stroke-linecap="round"></path>
</sc-if>
<path d="M100 106v9q0 4-5 4" fill="none" stroke="{{skinShade}}" stroke-width="3" stroke-linecap="round"></path>
<path d="M89 129q11 8 22 0" fill="none" stroke="#7A2E2E" stroke-width="3.500" stroke-linecap="round"></path>

</sc-if>
<sc-if value="{{ showGlasses }}" hint-placeholder-val="{{ false }}">

<rect x="{{gX1}}" y="{{gY}}" width="{{gW}}" height="{{gH}}" rx="{{gR}}" fill="{{gFill}}" fill-opacity="{{gFillOpacity}}"></rect>
<rect x="{{gX2}}" y="{{gY}}" width="{{gW}}" height="{{gH}}" rx="{{gR}}" fill="{{gFill}}" fill-opacity="{{gFillOpacity}}"></rect>
<path d="M95 98h10M64 96l-10-3M136 96l10-3" fill="none"></path>
</g>
</sc-if>
</svg>
</div>
<sc-if value="{{ hasPet }}" hint-placeholder-val="{{ false }}">
<div data-color-bg="pet" style="position: absolute; right: -4px; bottom: -4px; width: 52px; height: 52px; box-sizing: border-box; border: 4px solid #171A36; border-radius: 50%; background: {{petColor}}; display: flex; align-items: center; justify-content: center; font-size: 28px; line-height: 1">{{ petEmoji }}</div>
</sc-if>
</div>
<div style="display: flex; gap: 8px; overflow-x: auto; margin: 0 -20px; padding: 0 20px; flex-shrink: 0">
<sc-for list="{{ tabs }}" as="tb" hint-placeholder-count="7">
<button onClick="{{ tb.pick }}" aria-pressed="{{ tb.pressed }}" style="height: 44px; flex-shrink: 0; padding: 0 16px; border: 0; border-radius: 22px; background: {{tb.bg}}; color: {{tb.fg}}; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer">{{ tb.label }}</button>
</sc-for>
</div>
<div style="flex-grow: 1; min-height: 0; box-sizing: border-box; padding: 16px; background: #232750; border-radius: 20px; display: flex; flex-direction: column; gap: 16px; overflow-y: auto">
<sc-if value="{{ isPet }}" hint-placeholder-val="{{ false }}">
<sc-if value="{{ showPetColors }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 14px; font-weight: 500; color: #B9BDE6">{{ colorLabel }}</div>
<div style="display: flex; gap: 14px; flex-wrap: wrap">
<sc-for list="{{ colors }}" as="co" hint-placeholder-count="8">

</sc-if>
<sc-if value="{{ co.isAdd }}" hint-placeholder-val="{{ false }}">
<div style="position: relative; width: 44px; height: 44px; flex-shrink: 0">
<input type="color" oninput="{{ co.liveInput }}" onchange="{{ co.pick }}" value="{{ co.addValue }}" aria-label="Özel renk ekle" style="position: absolute; inset: 0; width: 44px; height: 44px; opacity: 0; border: 0; padding: 0; cursor: pointer">
<div data-color-bg="pet" style="position: absolute; inset: 0; box-sizing: border-box; border: 2px dashed #8D93C9; border-radius: 50%; background: {{co.addBg}}; box-shadow: {{co.addRing}}; display: flex; align-items: center; justify-content: center; pointer-events: none">

</div>
</div>
</sc-if>
</sc-for>
</div>
</div>
</sc-if>
<div style="display: flex; flex-direction: column; gap: 10px">

<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{ petOptions }}" as="po" hint-placeholder-count="12">
<button onClick="{{ po.pick }}" aria-label="{{ po.name }}" aria-pressed="{{ po.pressed }}" style="height: 88px; padding: 10px 0; border: 0; border-radius: 14px; background: #2E3366; box-shadow: {{po.ring}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; cursor: pointer">
<sc-if value="{{ po.isYok }}" hint-placeholder-val="{{ true }}">

<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#B9BDE6" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><path d="M7 7l10 10"></path></svg>
</div>
</sc-if>
<sc-if value="{{ po.notYok }}" hint-placeholder-val="{{ false }}">
<div data-color-bg="pet" style="width: 40px; height: 40px; border-radius: 50%; background: {{po.circleColor}}; display: flex; align-items: center; justify-content: center; font-size: 22px; line-height: 1">{{ po.emoji }}</div>
</sc-if>
<span style="font-size: 12px; font-weight: 500; text-align: center; padding: 0 2px">{{ po.name }}</span>
</button>
</sc-for>
</div>
</div>
</sc-if>
<sc-if value="{{ isFace }}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 14px; font-weight: 500; color: #B9BDE6">{{ optionLabel }}</div>

<path d="M89 129q11 8 22 0" fill="none" stroke="#7A2E2E" stroke-width="3.500" stroke-linecap="round"></path>

<path d="M95 98h10M64 96l-10-3M136 96l10-3" fill="none"></path>
</g>

</svg>
</button>
</sc-for>
</div>
</div>
</sc-if>

<div style="display: flex; gap: 14px; flex-wrap: wrap">
<sc-for list="{{ colors }}" as="co" hint-placeholder-count="6">
<sc-if value="{{ co.isPreset }}" hint-placeholder-val="{{ true }}">
<button onClick="{{ co.pick }}" aria-label="{{ co.name }}" aria-pressed="{{ co.pressed }}" style="width: 44px; height: 44px; flex-shrink: 0; border: 0; border-radius: 50%; background: {{co.hex}}; box-shadow: {{co.ring}}; cursor: pointer"></button>
</sc-if>
<sc-if value="{{ co.isAdd }}" hint-placeholder-val="{{ false }}">
<div style="position: relative; width: 44px; height: 44px; flex-shrink: 0">
<input type="color" onchange="{{ co.pick }}" value="{{ co.addValue }}" aria-label="Özel renk ekle" style="position: absolute; inset: 0; width: 44px; height: 44px; opacity: 0; border: 0; padding: 0; cursor: pointer">

</div>
