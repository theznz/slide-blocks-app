  var current = data.filter(function (t) { return t.id === picked; })[0] || data[0];\n    var owned = d.themesOwned.indexOf(picked) !== -1;\n    var themes = data.map(function (t) {\n      var on = t.id === picked;\n      var isOwned = d.themesOwned.indexOf(t.id) !== -1;\n      var status = !isOwned ? (t.cost + ' yıldız') : (t.id === d.theme ? 'Seçili' : 'Sende var');\n      return {\n        name: t.name, c1: t.c1, c2: t.c2, c3: t.c3,\n        status: status, statusColor: !isOwned ? '#FFD35C' : '#B9BDE6',\n        ring: on ? '0 0 0 3px #FFFFFF' : 'none',\n        pressed: on ? 'true' : 'false',\n        pick: function () { self.setState({ picked: t.id }); }\n      };\n    });\n    var cta;\n    if (owned) cta = (picked === d.theme) ? 'Kullanılıyor' : 'Temayı kullan';\n    else cta = 'Kilidi aç (' + current.cost + ' ★)';\n    return {\n      stars: d.stars,\n      themes: themes,\n      pickedName: current.name,\n      pickedStatus: owned ? (picked === d.theme ? 'Şu an kullanılıyor' : 'Koleksiyonunda') : (current.cost + ' yıldızla açılır'),\n      c1: current.c1, c2: current.c2, c3: current.c3,\n      cta: cta,\n      apply: function () {\n        if (owned) {\n          d.theme = picked; App.save(); App.toast(current.name + ' teması uygulandı'); self.forceUpdate();\n        } else if (d.stars >= current.cost) {\n          d.stars -= current.cost; d.themesOwned.push(picked); d.theme = picked; App.save();\n          App.toast(current.name + ' açıldı!'); self.forceUpdate();\n        } else {\n          App.toast('Yetersiz yıldız');\n        }\n      }\n    };\n  }\n}\n"}, "Profile": {"markup": "\n<div style=\"width: 390px; height: 844px; box-sizing: border-box; background: #171A36; color: #FFFFFF; font-family: 'Fredoka', system-ui, sans-serif; padding: 56px 20px 32px; display: flex; flex-direction: column; gap: 20px\">\n<div style=\"display: flex; justify-content: space-between; align-items: center\">\n<a href=\"Main.dc.html\" aria-label=\"Geri\" style=\"width: 44px; , sans-serif; padding: 56px 20px 32px; display: flex; flex-direction: column; gap: 20px\">\n<div style=\"display: flex; align-items: center; justify-content: space-between\">\n<a href=\"Main.dc.html\" aria-label=\"Geri\" style=\"width: 44px; height: 44px; border-radius: 14px; background: #232750; color: #FFFFFF; display: flex; align-items: center; justify-content: center\">\n<svg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.500\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M15 5l-7 7 7 7\"/><\/svg>\n<\/a>\n<h1 style=\"margin: 0; font-size: 24px; font-weight: 600\">Günlük bulmaca<\/h1>\n<a href=\"Reward.dc.html\" aria-label=\"Günlük ödül\" style=\"width: 44px; height: 44px; border-radius: 14px; background: #232750; color: #FFD35C; display: flex; align-items: center; justify-content: center\">\n<svg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.200\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"3\" y=\"9\" width=\"18\" height=\"12\" rx=\"2\"/><path d=\"M12 9v12M3 13h18M8.500 9C6 9 5.500 5 8 5s4 4 4 4M15.500 9C18 9 18.500 5 16 5s-4 4-4 4\"/><\/svg>\n<\/a>\n<\/div>\n<div style=\"display: flex; align-items: center; gap: 14px; padding: 16px; background: #232750; border-radius: 20px\">\n<div style=\"width: 52px; height: 52px; flex-shrink: 0; box-sizing: border-box; padding-bottom: 5px; background: #FF9F45; border-radius: 16px; box-shadow: inset 0 -5px 0 #D9772A; color: #171A36; display: flex; align-items: center; justify-content: center\">\n<svg viewBox=\"0 0 24 24\" width=\"26\" height=\"26\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.200\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3c1 3 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-6 1-9z\"/><\/svg>\n<\/div>\n<div style=\"display: flex; flex-direction: column; gap: 2px\">\n<div style=\"font-size: 20px; font-weight: 600; line-height: 1.1\">{{ streakLabel }}<\/div>\n<div style=\"font-size: 14px; color: #B9BDE6\">{{ streakSub }}<\/div>\n<\/div>\n<\/div>\n<div style=\"padding: 16px; background: #232750; border-radius: 20px; display: flex; flex-direction: column; gap: 12px\">\n<div style=\"font-size: 18px; font-weight: 600\">{{ monthLabel }}<\/div>\n<div style=\"display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; font-size: 12px; font-weight: 500; color: #B9BDE6; text-align: center\">\n<span>Pzt<\/span><span>Sal<\/span><span>Çar<\/span><span>Per<\/span><span>Cum<\/span><span>Cmt<\/span><span>Paz<\/span>\n<\/div>\n<div style=\"display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px\">\n<sc-for list=\"{{ days }}\" as=\"d\" hint-placeholder-count=\"35\">\n<div style=\"height: 40px; box-sizing: border-box; border-radius: 12px; background: {{d.bg}}; border: {{d.border}}; color: {{d.fg}}; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center\">{{ d.n }}<\/div>\n<\/sc-for>\n<\/div>\n<div style=\"display: flex; justify-content: center; gap: 16px; font-size: 13px; color: #B9BDE6\">\n<span style=\"display: flex; align-items: center; gap: 6px\"><span style=\"width: 12px; height: 12px; border-radius: 4px; background: #3DD6C3\"><\/span>Çözüldü<\/span>\n<span style=\"display: flex; align-items: center; gap: 6px\"><span style=\"width: 12px; height: 12px; border-radius: 4px; background: #FF9F45\"><\/span>Bugün<\/span>\n<span style=\"display: flex; align-items: center; gap: 6px\"><span style=\"width: 12px; height: 12px; box-sizing: border-box; border-radius: 4px; border: 2px solid #3A4080\"><\/span>Kaçırıldı<\/span>\n<\/div>\n<\/div>\n<div style=\"margin-top: auto; display: flex; flex-direction: column; gap: 12px\">\n<div style=\"display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; background: #232750; border-radius: 18px; font-size: 16px; font-weight: 500\">\n<span>{{ dateLabel }}<\/span>\n<span style=\"display: flex; align-items: center; gap: 6px; color: #FFD35C\">\n<svg viewBox=\"0 0 24 24\" width=\"18\" height=\"18\" fill=\"#FFD35C\" aria-hidden=\"true\"><path d=\"M12 2.500l2.900 6.200 6.600.8-4.900 4.600 1.300 6.600L12 17.400l-5.900 3.300 1.300-6.600-4.900-4.600 6.600-.8z\"/><\/svg>\n{{ rewardLabel }}<\/span>\n<\/div>\n<button onclick=\"{{ play }}\" style=\"height: 72px; box-sizing: border-box; padding-bottom: 6px; border: 0; background: #FF9F45; border-radius: 22px; box-shadow: inset 0 -6px 0 #D9772A; color: #171A36; font-family: inherit; text-decoration: none; font-size: 22px; font-weight: 700; display: flex; align-items: center; justify-content: center; cursor: pointer\">{{ playLabel }}<\/button>\n<\/div>\n<\/div>\n", "code": "\nclass Component extends DCLogic {\n  renderVals() {\n    var d = App.data;\n    var now = new Date();\n    var year = now.getFullYear(), month = now.getMonth(), today = now.getDate();\n    var monthNames = ['Ocak', 'Şubat', 'Mart', 'Nisan', 'Mayıs', 'Haziran', 'Temmuz', 'Ağustos', 'Eylül', 'Ekim', 'Kasım', 'Aralık'];\n    var firstWeekday = (new Date(year, month, 1).getDay() + 6) % 7; // 0=Mon\n    var daysInMonth = new Date(year, month + 1, 0).getDate();\n    var days = [];\n    for (var i = 0; i < firstWeekday; i++) days.push({ n: '', bg: 'transparent', border: '0', fg: '#FFFFFF' });\n    for (var n = 1; n <= daysInMonth; n++) {\n      var key = year + '-' + String(month + 1).padStart(2, '0') + '-' + String(n).padStart(2, '0');\n      var dd = { n: n, bg: 'transparent', border: '0', fg: '#8D93C9' };\n      if (d.daily.claimed[key]) { dd.bg = '#3DD6C3'; dd.fg = '#171A36'; }\n      else if (n === today) { dd.bg = '#FF9F45'; dd.fg = '#171A36'; }\n      else if (n < today) { dd.border = '2px solid #3A4080'; dd.fg = '#B9BDE6'; }\n      days.push(dd);\n    }\n    var lvlIdx = App.dailyLevelIndex();\n    var lv = App.getLevel(lvlIdx);\n    var todayKey = App.dateKey();\n    var doneToday = !!d.daily.claimed[todayKey];\n    return {\n      streak: d.daily.streak,\n      streakLabel: d.daily.streak + ' günlük seri',\n      streakSub: doneToday ? 'Bugün çözdün, yarın tekrar gel!' : ('Bugünü de oyna, seriyi ' + (d.daily.streak + 1) + ' güne çıkar.'),\n      monthLabel: monthNames[month] + ' ' + year,\n      days: days,\n      dateLabel: today + ' ' + monthNames[month] + ' · ' + lv.tier,\n      rewardLabel: doneToday ? 'Bugün tamamlandı' : ('Ödül: ' + (3 + Math.min(7, d.daily.streak + 1)) + ' yıldız'),\n      playLabel: doneToday ? 'Yarın tekrar gel' : 'Bugünkü bulmacayı oyna',\n      play: function () {\n        if (doneToday) { App.toast('Bugünün bulmacası zaten tamamlandı'); return; }\n        d.currentLevelIndex = lvlIdx; d.pendingRestart = true; d.dailyMode = true;\n        window.go('Game');\n      }\n    };\n  }\n}\n"}, "Reward": {"markup": "\n<div style=\"width: 390px; height: 844px; box-sizing: border-box; background: #0E1024; color: #FFFFFF; font-family: 'Fredoka', system-ui, sans-serif; padding: 56px 20px 32px; display: flex; flex-direction: column; justify-content: center\">\n<div style=\"padding: 28px 20px 20px; background: #232750; border-radius: 28px; display: flex; flex-direction: column; gap: 20px\">\n<div style=\"display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center\">\n<h1 style=\"margin: 0; font-size: 30px; font-weight: 700\">Günlük ödül<\/h1>\n<div style=\"font-size: 15px; color: #B9BDE6\">Her gün gir, ödül büyüsün. 7. gün büyük ödül seni bekliyor.<\/div>\n<\/div>\n<div style=\"display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px\">\n<sc-for list=\"{{ days }}\" as=\"d\" hint-placeholder-count=\"7\">\n<div style=\"grid-column: {{d.span}}; height: 92px; box-sizing: border-box; padding-bottom: {{d.pad}}; border-radius: 16px; background: {{d.bg}}; box-shadow: {{d.shadow}}; border: {{d.border}}; color: {{d.fg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px\">\n<span style=\"font-size: 12px; font-weight: 500\">{{ d.day }}<\/span>\n<svg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.200\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"{{d.icon}}\"><\/path><\/svg>\n<span style=\"font-size: 14px; font-weight: 600\">{{ d.reward }}<\/span>\n<\/div>\n<\/sc-for>\n<\/div>\n<button onclick=\"{{ goDaily }}\" style=\"height: 68px; box-sizing: border-box; padding-bottom: 6px; border: 0; background: #FF9F45; border-radius: 20px; box-shadow: inset 0 -6px 0 #D9772A; color: #171A36; font-family: inherit; text-decoration: none; font-size: 20px; font-weight: 700; display: flex; align-items: center; justify-content: center; cursor: pointer\">{{ ctaLabel }}<\/button>\n<a href=\"Main.dc.html\" style=\"align-self: center; min-height: 44px; display: flex; align-items: center; font-size: 15px; font-weight: 500; color: #B9BDE6\">Sonra<\/a>\n<\/div>\n<\/div>\n", "code": "\nclass Component extends DCLogic {\n  renderVals() {\n    var star = 'M12 2.500l2.900 6.200 6.600.8-4.900 4.600 1.300 6.600L12 17.400l-5.900 3.300 1.300-6.600-4.900-4.600 6.600-.8z';\n    var check = 'M5 12l5 5 9-10';\n    var gift = 'M4 10h16v10H4zM12 10v10M3 7h18v3H3zM12 7c-1-3-5-3-4 0M12 7c1-3 5-3 4 0';\n    var d = App.data;\n    var todayKey = App.dateKey();\n    var doneToday = !!d.daily.claimed[todayKey];\n    var todayPos = doneToday ? ((d.daily.streak - 1) % 7 + 7) % 7 + 1 : (d.daily.streak % 7) + 1;\n    var rewards = [3, 4, 5, 6, 7, 8, 10];\n    var days = rewards.map(function (r, i) {\n      var n = i + 1;\n      var dd = { day: n + '. gün', reward: r + ' yıldız', icon: star, span: n === 7 ? 'span 2' : 'auto', pad: '0', bg: '#2E3366', shadow: 'none', border: '0', fg: '#FFFFFF' };\n      if (n < todayPos || (n === todayPos && doneToday)) { dd.icon = check; dd.reward = 'Alındı'; dd.fg = '#B9BDE6'; }\n      else if (n === todayPos) { dd.bg = '#FFD35C'; dd.shadow = 'inset 0 -5px 0 #D9A92F'; dd.pad = '5px'; dd.fg = '#171A36'; }\n      else { dd.bg = 'transparent'; dd.border = '2px solid #3A4080'; dd.fg = '#B9BDE6'; }\n      return dd;\n    });\n    return {\n      days: days,\n      ctaLabel: doneToday ? 'Bugünü tamamladın' : (todayPos + '. gün ödülü için bulmacaya git'),\n      goDaily: function () { window.go('Daily'); }\n    };\n  }\n}\n"}, "Leaderboard": {"markup": "\n<div style=\"width: 390px; height: 844px; box-sizing: border-box; background: #171A36; color: #FFFFFF; font-family: 'Fredoka', system-ui, sans-serif; padding: 56px 20px 32px; display: flex; flex-direction: column; gap: 20px\">\n<div style=\"display: flex; align-items: center; gap: 16px\">\n<a href=\"Profile.dc.html\" aria-label=\"Geri\" style=\"width: 44px; height: 44px; border-radius: 14px; background: #232750; color: #FFFFFF; display: flex; align-items: center; justify-content: center\">\n<svg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.500\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M15 5l-7 7 7 7\"/><\/svg>\n<\/a>\n<h1 style=\"margin: 0; font-size: 24px; font-weight: 600\">Sıralama<\/h1>\n<\/div>\n<div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px\">\n<sc-for list=\"{{ tabs }}\" as=\"tb\" hint-placeholder-count=\"2\">\n<button onClick=\"{{ tb.pick }}\" aria-pressed=\"{{ tb.pressed }}\" style=\"height: 44px; border: 0; border-radius: 22px; background: {{tb.bg}}; color: {{tb.fg}}; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer\">{{ tb.label }}<\/button>\n<\/sc-for>\n<\/div>\n<div style=\"display: flex; flex-direction: column; gap: 8px\">\n<sc-for list=\"{{ rows }}\" as=\"r\" hint-placeholder-count=\"8\">\n<div style=\"height: 62px; box-sizing: border-box; padding: 0 16px 0 12px; border-radius: 16px; background: #232750; box-shadow: {{r.ring}}; display: flex; align-items: center; gap: 12px\">\n<div style=\"width: 32px; height: 32px; flex-shrink: 0; border-radius: 10px; background: {{r.rankBg}}; color: {{r.rankFg}}; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center\">{{ r.rank }}<\/div>\n<div style=\"width: 38px; height: 38px; flex-shrink: 0; border-radius: 50%; background: {{r.avatar}}; color: #171A36; display: flex; align-items: center; justify-content: center\">\n<svg viewBox=\"0 0 24 24\" width=\"20\" height=\"20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.400\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"8\" r=\"4\"/><path d=\"M4 21c0-4 3.600-6.500 8-6.500s8 2.500 8 6.500\"/><\/svg>\n<\/div>\n<div style=\"flex-grow: 1; min-width: 0; font-size: 17px; font-weight: 500\">{{ r.name }}<\/div>\n<div style=\"display: flex; align-items: center; gap: 6px; font-size: 17px; font-weight: 600\">\n<svg viewBox=\"0 0 24 24\" width=\"18\" height=\"18\" fill=\"#FFD35C\" aria-hidden=\"true\"><path d=\"M12 2.500l2.900 6.200 6.600.8-4.900 4.600 1.300 6.600L12 17.400l-5.900 3.300 1.300-6.600-4.900-4.600 6.600-.8z\"/><\/svg>\n<span>{{ r.stars }}<\/span>\n<\/div>\n<\/div>\n<\/sc-for>\n<\/div>\n<div style=\"margin-top: auto; text-align: center; font-size: 14px; color: #B9BDE6\">{{ footer }}<\/div>\n<\/div>\n", "code": "\nclass Component extends DCLogic {\n  renderVals() {\n    var self = this;\n    var tab = (this.state && this.state.tab) || 'arkadas';\n    var tabs = [['arkadas', 'Arkadaşlar'], ['dunya', 'Dünya']].map(function (t) {\n      var on = t[0] === tab;\n      return { label: t[1], pressed: on ? 'true' : 'false', bg: on ? '#3DD6C3' : '#232750', fg: on ? '#171A36' : '#B9BDE6', pick: function () { self.setState({ tab: t[0] }); } };\n    });\n    var myStars = App.earnedStarsTotal();\n    var palette = ['#6C8CFF', '#FF7AA8', '#3DD6C3', '#FFD35C'];\n    var names = tab === 'arkadas' ? ['Ela', 'Mert', 'Zeynep', 'Kaan', 'Defne', 'Arda', 'Nil'] : ['Aylin', 'Berk', 'Cem', 'Derya', 'Emre', 'Filiz', 'Gökhan'];\n    var baseScores = tab === 'arkadas' ? [58, 44, 39, 31, 27, 20, 12] : [540, 538, 531, 525, 519, 512, 508];\n    var rows = names.map(function (nm, i) { return { name: nm, stars: baseScores[i] }; });\n    rows.push({ name: 'Sen', stars: myStars, me: true });\n    rows.sort(function (a, b) { return b.stars - a.stars; });\n    rows = rows.map(function (r, i) {\n      var medal = i < 3 && !r.me;\n      return {\n        rank: i + 1, name: r.name, stars: r.stars,\n        avatar: r.me ? '#FF9F45' : palette[i % 4],\n        ring: r.me ? '0 0 0 3px #FF9F45' : 'none',\n        rankBg: medal ? '#FFD35C' : '#2E3366', rankFg: medal ? '#171A36' : '#FFFFFF'\n      };\n    });\n    var myRank = rows.filter(function (r) { return r.name === 'Sen'; })[0];\n    return { tabs: tabs, rows: rows, footer: (tab === 'arkadas' ? 'Arkadaşların arasında' : 'Bu cihazdaki sıralamada') + ' ' + myRank.rank + '. sıradasın. (Çevrimdışı, sadece bu cihazda)' };\n  }\n}\n"}, "Badges": {"markup": "\n<div style=\"width: 390px; height: 844px; box-sizing: border-box; background: #171A36; color: #FFFFFF; font-family: 'Fredoka', system-ui, sans-serif; padding: 56px 20px 32px; display: flex; flex-direction: column; gap: 20px\">\n<div style=\"display: flex; align-items: center; justify-content: space-between\">\n<a href=\"Profile.dc.html\" aria-label=\"Geri\" style=\"width: 44px; height: 44px; border-radius: 14px; background: #232750; color: #FFFFFF; display: flex; align-items: center; justify-content: center\">\n<svg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.500\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M15 5l-7 7 7 7\"/><\/svg>\n<\/a>\n<h1 style=\"margin: 0; font-size: 24px; font-weight: 600\">Rozetler<\/h1>\n<div style=\"height: 44px; padding: 0 14px; background: #232750; border-radius: 22px; font-size: 17px; font-weight: 600; display: s, cost) {\n    if (App.data.stars < cost) { App.toast('Yetersiz yıldız'); return; }\n    App.data.stars -= cost;\n    App.data.hints += hints;\n    App.save();\n    App.toast('+' + hints + ' ipucu eklendi');\n    this.forceUpdate();\n  }\n  renderVals() {\n    var self = this;\n    var watching = this.state && this.state.watching;\n    return {\n      stars: App.data.stars, hints: App.data.hints,\n      watching: watching,\n      watchLabel: watching ? 'İzleniyor…' : 'İzle',\n      buy5: function () { self.buy(5, 25); },\n      buy15: function () { self.buy(15, 60); },\n      buy40: function () { self.buy(40, 140); },\n      watchAd: function () {\n        if (watching) return;\n        self.setState({ watching: true });\n        setTimeout(function () {\n          App.data.hints += 1; App.save();\n          self.setState({ watching: false });\n          App.toast('+1 ipucu kazandın');\n        }, 1400);\n      },\n      noAds: function () {\n        if (App.data.stars < 200) { App.toast('Yetersiz yıldız'); return; }\n        App.data.stars -= 200; App.data.adsRemoved = true; App.save();\n        App.toast('Reklamlar kaldırıldı');\n        self.forceUpdate();\n      },\n      adsRemoved: App.data.adsRemoved,\n      restore: function () { App.toast('Geri yüklenecek bir satın alım bulunamadı'); }\n    };\n  }\n}\n"}, "NoHints": {"markup": "\n<div style=\"width: 390px; height: 844px; box-sizing: border-box; background: #0E1024; color: #FFFFFF; font-family: 'Fredoka', system-ui, sans-serif; padding: 56px 20px 32px; display: flex; flex-direction: column; justify-content: center\">\n<div style=\"padding: 28px 20px 16px; background: #232750; border-radius: 28px; display: flex; flex-direction: column; align-items: stretch; gap: 20px\">\n<div style=\"display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center\">\n<div style=\"width: 84px; height: 84px; box-sizing: border-box; padding-bottom: 6px; background: #FFD35C; border-radius: 26px; box-sh   App.totalPossibleStars = function () { return LEVELS.length * 3; };

  App.earnedStarsTotal = function () {
    var sum = 0;
    Object.keys(App.data.levels).forEach(function (k) { sum += App.data.levels[k].bestStars || 0; });
    return sum;
  };

  App.completedCount = function () {
    var c = 0;
    Object.keys(App.data.levels).forEach(function (k) { if ((App.data.levels[k].bestStars || 0) > 0) c++; });
    return c;
  };

  App.packageProgress = function (tierName) {
    var t = null;
    for (var i = 0; i < TIERS.length; i++) if (TIERS[i].name === tierName) t = TIERS[i];
    if (!t) return { done: 0, total: 0 };
    var done = 0;
    for (var n = t.from; n <= t.to; n++) {
      var rec = App.data.levels[n];
      if (rec && (rec.bestStars || 0) > 0) done++;
    }
    return { done: done, total: t.to - t.from + 1 };
  };

  App.starsForMoves = function (par, moves) {
    if (moves <= par) return 3;
    if (moves <= Math.ceil(par * 1.5) + 1) return 2;
    return 1;
  };

  App.recordResult = function (n, moves, timeSec, hintUsed) {
    var lv = App.getLevel(n);
    var par = lv.par;
    var earnedStars = App.starsForMoves(par, moves);
    var prev = App.data.levels[n] || { bestStars: 0, bestMoves: null, bestTimeSec: null, noHintClean: false };
    var delta = Math.max(0, earnedStars - (prev.bestStars || 0));
    var rec = {
      bestStars: Math.max(prev.bestStars || 0, earnedStars),
      bestMoves: prev.bestMoves == null ? moves : Math.min(prev.bestMoves, moves),
      bestTimeSec: prev.bestTimeSec == null ? timeSec : Math.min(prev.bestTimeSec, timeSec),
      noHintClean: !!prev.noHintClean || !hintUsed
    };
    App.data.levels[n] = rec;
    App.data.stars += delta;
    var unlockedNext = false;
    if (n === App.data.unlockedLevel && n < LEVELS.length) { App.data.unlockedLevel = n + 1; unlockedNext = true; }
    App.save();
    return { starsDelta: delta, starsNow: App.data.stars, bestStars: rec.bestStars, par: par, unlockedNext: unlockedNext };
  };

  App.paletteFor = function (themeId) { return GAME_PALETTE[themeId] || GAME_PALETTE.seker; };

  App.avatarLook = function (v) { return avatarLook(v || App.data.avatar); };

  App.fmtTime = function (sec) {
    sec = Math.max(0, sec | 0);
    var m = Math.floor(sec / 60), s = sec % 60;
    return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  };

  App.dateKey = function (d) {
    d = d || new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  };

  App.dailyLevelIndex = function () {
    var d = new Date();
    var dayOfYear = Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 86400000);
    return (dayOfYear % LEVELS.length) + 1;
  };

  App.claimDaily = function () {
    var key = App.dateKey();
    if (App.data.daily.claimed[key]) return { already: true };
    var y = new Date(); y.setDate(y.getDate() - 1);
    var yKey = App.dateKey(y);
    App.data.daily.streak = App.data.daily.claimed[yKey] ? (App.data.daily.streak + 1) : 1;
    App.data.daily.claimed[key] = true;
    App.data.daily.lastPlayedDate = key;
    var reward = 3 + Math.min(7, App.data.daily.streak);
    App.data.stars += reward;
    App.save();
    return { already: false, streak: App.data.daily.streak, reward: reward };
  };

  App.computeBadges = function () {
    var completed = App.completedCount();
    var anyThreeStar = Object.keys(App.data.levels).some(function (k) { return App.data.levels[k].bestStars === 3; });
    var fastest = null;
    Object.keys(App.data.levels).forEach(function (k) {
      var t = App.data.levels[k].bestTimeSec;
      if (t != null && (fastest == null || t < fastest)) fastest = t;
    });
    var noHintCount = Object.keys(App.data.levels).filter(function (k) { return App.data.levels[k].noHintClean; }).length;
    var perfectTier = TIERS.some(function (t) {
      for (var n = t.from; n <= t.to; n++) { var r = App.data.levels[n]; if (!r || r.bestStars !== 3) return false; }
      return true;
    });
    var defs = [
      { name: 'İlk çıkış', how: 'İlk seviyeyi bitir', icon: 'check', earned: completed >= 1, status: completed >= 1 ? null : '0 / 1' },
      { name: 'Üç yıldız', how: 'Bir seviyeyi 3 yıldızla bitir', icon: 'star', earned: anyThreeStar, status: anyThreeStar ? null : '0 / 1' },
      { name: 'Hızlı çözüm', how: '30 saniyenin altında bitir', icon: 'bolt', earned: fastest != null && fastest < 30, status: (fastest != null && fastest < 30) ? null : '0 / 1' },
      { name: 'İpucusuz 10', how: '10 seviyeyi ipucusuz bitir', icon: 'bulb', earned: noHintCount >= 10, status: noHintCount >= 10 ? null : (noHintCount + ' / 10') },
      { name: 'Haftalık seri', how: '7 gün üst üste oyna', icon: 'flame', earned: App.data.daily.streak >= 7, status: App.data.daily.streak >= 7 ? null : (App.data.daily.streak + ' / 7') },
      { name: LEVELS.length + ' seviye', how: 'Tüm seviyeleri tamamla', icon: 'flag', earned: completed >= LEVELS.length, status: completed >= LEVELS.length ? null : (completed + ' / ' + LEVELS.length) },
      { name: 'Kusursuz paket', how: 'Bir paketi tam yıldızla bitir', icon: 'crown', earned: perfectTier, status: perfectTier ? null : '0 / 1' },
      { name: 'Koleksiyoncu', how: 'Tüm temaları aç', icon: 'palette', earned: App.data.themesOwned.length >= THEMES.length, status: App.data.themesOwned.length >= THEMES.length ? null : (App.data.themesOwned.length + ' / ' + THEMES.length) },
      { name: 'Günlük usta', how: '30 günlük bulmaca çöz', icon: 'cal', earned: Object.keys(App.data.daily.claimed).length >= 30, status: Object.keys(App.data.daily.claimed).length >= 30 ? null : (Object.keys(App.data.daily.claimed).length + ' / 30') }
    ];
    return defs;
  };

  App._scale = 1;

  App.goOnline = function (target) {
    if (typeof navigator !== 'undefined' && navigator.onLine === false) {
      App.data.pendingOfflineTarget = target;
      window.go('Offline');
    } else {
      window.go(target);
    }
  };

  // ---- live board helpers (board is always 6x6, exit on right edge of the target's row) ----
  var N = 6;
  function cellsOf(b) {
    var out = [];
    for (var k = 0; k < b.len; k++) out.push(b.orient === 'h' ? [b.row, b.col + k] : [b.row + k, b.col]);
    return out;
  }
  function buildGrid(blocks, excludeId) {
    var grid = []; for (var r = 0; r < N; r++) grid.push(new Array(N).fill(-1));
    blocks.forEach(function (b) {
      if (b.id === excludeId) return;
      cellsOf(b).forEach(function (rc) { grid[rc[0]][rc[1]] = b.id; });
    });
    return grid;
  }
  App.cellsOf = cellsOf;

  App.computeRange = function (blocks, movingId) {
    var moving = blocks.filter(function (b) { return b.id === movingId; })[0];
    var grid = buildGrid(blocks, movingId);
    var min, max;
    if (moving.orient === 'h') {
      min = moving.col; max = moving.col;
      for (var c = moving.col - 1; c >= 0 && grid[moving.row][c] === -1; c--) min = c;
      for (var c2 = moving.col + moving.len; c2 < N && grid[moving.row][c2] === -1; c2++) max = c2 - moving.len + 1;
    } else {
      min = moving.row; max = moving.row;
      for (var r = moving.row - 1; r >= 0 && grid[r][moving.col] === -1; r--) min = r;
      for (var r2 = moving.row + moving.len; r2 < N && grid[r2][moving.col] === -1; r2++) max = r2 - moving.len + 1;
    }
    return { min: min, max: max };
  };

  function stateKey(blocks) { return blocks.map(function (b) { return b.row * N + b.col; }).join(','); }

  function neighborMoves(blocks) {
    var out = [];
    blocks.forEach(function (v) {
      var grid = buildGrid(blocks, v.id);
      if (v.orient === 'h') {
        for (var nc = v.col - 1; nc >= 0 && grid[v.row][nc] === -1; nc--) {
          out.push({ id: v.id, pos: nc, next: blocks.map(function (b) { return b.id === v.id ? Object.assign({}, b, { col: nc }) : b; }) });
        }
        for (var nc2 = v.col + 1; nc2 + v.len - 1 < N && grid[v.row][nc2 + v.len - 1] === -1; nc2++) {
          out.push({ id: v.id, pos: nc2, next: blocks.map(function (b) { return b.id === v.id ? Object.assign({}, b, { col: nc2 }) : b; }) });
        }
      } else {
        for (var nr = v.row - 1; nr >= 0 && grid[nr][v.col] === -1; nr--) {
          out.push({ id: v.id, pos: nr, next: blocks.map(function (b) { return b.id === v.id ? Object.assign({}, b, { row: nr }) : b; }) });
        }
        for (var nr2 = v.row + 1; nr2 + v.len - 1 < N && grid[nr2 + v.len - 1][v.col] === -1; nr2++) {
          out.push({ id: v.id, pos: nr2, next: blocks.map(function (b) { return b.id === v.id ? Object.assign({}, b, { row: nr2 }) : b; }) });
        }
      }
    });
    return out;
  }

  function isSolved(blocks) {
    var t = blocks.filter(function (b) { return b.target; })[0];
    return t.col === N - t.len;
  }

  // BFS from current board to the solved state; returns the first move to play, or null.
  App.solveNextMove = function (blocks, cap) {
    cap = cap || 250000;
    if (isSolved(blocks)) return null;
    var startKey = stateKey(blocks);
    var visited = Object.create(null);
    visited[startKey] = { parent: null, move: null };
    var queue = [blocks];
    var qi = 0;
    var foundKey = null;
    var count = 1;
    while (qi < queue.length && !foundKey) {
      var cur = queue[qi++];
      var curKey = stateKey(cur);
      var moves = neighborMoves(cur);
      for (var i = 0; i < moves.length; i++) {
        var mv = moves[i];
        var k = stateKey(mv.next);
        if (visited[k]) continue;
        visited[k] = { parent: curKey, move: mv };
        count++;
        if (isSolved(mv.next)) { foundKey = k; break; }
        queue.push(mv.next);
        if (count > cap) break;
      }
      if (count > cap) break;
    }
    if (!foundKey) return null;
    var k = foundKey;
    while (visited[k].parent !== startKey) { k = visited[k].parent; }
    var firstMove = visited[k].move;
    var movingInStart = blocks.filter(function (b) { return b.id === firstMove.id; })[0];
    var fromPos = movingInStart.orient === 'h' ? movingInStart.col : movingInStart.row;
    return { id: firstMove.id, orient: movingInStart.orient, fromPos: fromPos, toPos: firstMove.pos };
  };

  return App;
})();

(function () {
  var data = JSON.parse(document.getElementById('screens').textContent);
  var stage = document.getElementById('stage');
  var HOLE = /\{\{([^}]+)\}\}/g;
  var WHOLE = /^\s*\{\{([^}]+)\}\}\s*$/;

  function lookup(scope, path) {
    path = path.trim();
    if (path === 'true') return true;
    if (path === 'false') return false;
    var o = scope, parts = path.split('.');
    for (var i = 0; i < parts.length; i++) { if (o == null) return undefined; o = o[parts[i]]; }
    return o;
  }
  function fill(str, scope) {
    return str.replace(HOLE, function (m, p) { var v = lookup(scope, p); return v == null ? '' : v; });
  }
  function kids(node, scope, out) {
    for (var c = node.firstChild; c; c = c.nextSibling) render(c, scope, out);
  }
  function render(node, scope, out) {
    if (node.nodeType === 3) { out.appendChild(document.createTextNode(fill(node.nodeValue, scope))); return; }
    if (node.nodeType !== 1) return;
    var tag = node.localName, m;
    if (tag === 'sc-if') {
      m = WHOLE.exec(node.getAttribute('value') || '');
      if (m && lookup(scope, m[1])) kids(node, scope, out);
      return;
    }
    if (tag === 'sc-for') {
      m = WHOLE.exec(node.getAttribute('list') || '');
      var list = (m && lookup(scope, m[1])) || [];
      var as = node.getAttribute('as') || 'item';
      list.forEach(function (it, i) {
        var s = Object.create(scope); s[as] = it; s.$index = i;
        kids(node, s, out);
      });
      return;
    }
    var el = node.cloneNode(false);
    Array.prototype.slice.call(node.attributes).forEach(function (a) {
      var w = WHOLE.exec(a.value);
      var lname = a.name.toLowerCase();
      if (lname.indexOf('on') === 0 && lname.length > 2) {
        el.removeAttribute(a.name);
        var fn = w && lookup(scope, w[1]);
        if (typeof fn === 'function') el.addEventListener(lname.slice(2), fn);
      } else if (w) {
        var v = lookup(scope, w[1]);
        el.setAttribute(a.name, v == null ? '' : v);
      } else if (a.value.indexOf('{{') !== -1) {
        el.setAttribute(a.name, fill(a.value, scope));
      }
    });
    kids(node, scope, el);
    out.appendChild(el);
  }

  var views = {};
  Object.keys(data).forEach(function (name) {
    var tpl = document.createElement('template');
    tpl.innerHTML = data[name].markup;
    var box = document.createElement('div');
    box.className = 'screen';
    stage.appendChild(box);
    var view = { box: box };
    function DCLogic() { this.props = {}; this.state = null; }
    DCLogic.prototype.setState = function (patch) {
      this.state = Object.assign({}, this.state, patch);
      view.draw();
    };
    DCLogic.prototype.forceUpdate = function () { view.draw(); };
    DCLogic.prototype.onShow = function () {};
    DCLogic.prototype.onHide = function () {};
    var Component = new Function('DCLogic', data[name].code + '\nreturn Component;')(DCLogic);
    var inst = new Component();
    view.inst = inst;
    view.draw = function () {
      var keep = {};
      Array.prototype.forEach.call(box.querySelectorAll('[style*="overflow-x"]'), function (e, i) { keep[i] = e.scrollLeft; });
      var frag = document.createDocumentFragment();
      var vals;
      try { vals = inst.renderVals() || {}; } catch (err) { console.error('renderVals error in', name, err); vals = {}; }
      kids(tpl.content, vals, frag);
      box.textContent = '';
      box.appendChild(frag);
      Array.prototype.forEach.call(box.querySelectorAll('[style*="overflow-x"]'), function (e, i) { if (keep[i]) e.scrollLeft = keep[i]; });
    };
    view.draw();
    views[name] = view;
  });

  var activeName = null;
  function go(name) {
    if (!views[name]) return;
    if (activeName && views[activeName] && views[activeName].inst.onHide) {
      try { views[activeName].inst.onHide(); } catch (e) { console.error(e); }
    }
    Object.keys(views).forEach(function (n) { views[n].box.classList.toggle('on', n === name); });
    if (views[name].inst.onShow) {
      try { views[name].inst.onShow(); } catch (e) { console.error(e); }
    }
    views[name].draw();
    activeName = name;
  }
  window.go = go;
  window.__views = views;

  stage.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a[href]');
    if (!a) return;
    e.preventDefault();
    var m = /([A-Za-z0-9_-]+)\.dc\.html$/.exec(a.getAttribute('href'));
    if (m) go(m[1]);
  });

  function fit() {
    var w = window.innerWidth, h = window.innerHeight;
    var k = Math.min(w / 390, h / 844);
    var framed = w > 390 * k + 24;
    if (framed) k = Math.min(k, (h - 32) / 844);
    stage.classList.toggle('framed', framed);
    stage.style.transform = 'translate(-50%,-50%) scale(' + k + ')';
    window.App._scale = k;
  }
  window.addEventListener('resize', fit);
  fit();

  // ---- toast ----
  var toastEl = document.createElement('div');
  toastEl.style.cssText = 'position:absolute;left:20px;right:20px;bottom:28px;padding:14px 18px;background:#232750;color:#FFFFFF;border-radius:16px;font-family:Fredoka,system-ui,sans-serif;font-size:15px;font-weight:500;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.4);opacity:0;transform:translateY(10px);transition:opacity .2s,transform .2s;pointer-events:none;z-index:9999';
  stage.appendChild(toastEl);
  var toastTimer = null;
  window.App.toast = function (msg, ms) {
    toastEl.textContent = msg;
    toastEl.style.opacity = '1';
    toastEl.style.transform = 'translateY(0)';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      toastEl.style.opacity = '0';
      toastEl.style.transform = 'translateY(10px)';
    }, ms || 2000);
  };

  go('Splash');
})();
