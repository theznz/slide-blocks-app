\n    if (owned) cta = App.t((picked === d.theme) ? 'Kullanılıyor' : 'Temayı kullan');\n    else cta = App.t('Kilidi aç ({n} ★)', { n: current.cost });\n    return {\n      stars: d.stars,\n      themes: themes,\n      pickedName: currentName,\n      pickedStatus: owned ? App.t(picked === d.theme ? 'Şu an kullanılıyor' : 'Koleksiyonunda') : App.t('{n} yıldızla açılır', { n: current.cost }),\n      p1: tile(current.id, current.c1, 11), p2: tile(current.id, current.c2, 11), p3: tile(current.id, current.c3, 11),\n      cta: cta,\n      apply: function () {\n        if (owned) {\n          d.theme = picked; App.save(); App.toast(App.t('{name} teması uygulandı', { name: currentName })); self.forceUpdate();\n        } else if (d.stars >= current.cost) {\n          d.stars -= current.cost; d.themesOwned.push(picked); d.theme = picked; App.save();\n          App.sfx('coin'); App.toast(App.t('{name} açıldı!', { name: currentName })); self.forceUpdate();\n        } else {\n          App.sfx('error'); App.toast(App.t('Yetersiz yıldız'));\n        }\n      }\n    };\n  }\n}\n"}, "Profile": {"markup": "\n<div style=\"width: 390px; height: 844px; box-sizing: border-box; background: #171A36; color: #FFFFFF; font-family: 'Baloo 2', system-ui, sans-serif; padding: 56px 20px 32px; display: flex; flex-direction: column; gap: 20px\">\n<div style=\"display: flex; justify-content: space-between; align-items: center\">\n<a href=\"Main.dc.html\" aria-label=\"Geri\" style=\"width: 44px; height: 44px; border-radius: 14px; background: #232750; color: #FFFFFF; display: flex; align-items: center; justify-content: center\">\n<svg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.500\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M15 5l-7 7 7 7\"><\/path><\/svg>\n<\/a>\n<h1 style=\"margin: 0; font-size: 24px; font-weight: 600\">Profil<\/h1>\n<a href=\"Settings.dc.html\" aria-label=\"Ayarlar\" style=\"width: x(0, 1fr)); gap: 6px; font-size: 12px; font-weight: 500; color: #B9BDE6; text-align: center\">\n<span>Pzt<\/span><span>Sal<\/span><span>Çar<\/span><span>Per<\/span><span>Cum<\/span><span>Cmt<\/span><span>Paz<\/span>\n<\/div>\n<div style=\"display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px\">\n<sc-for list=\"{{ days }}\" as=\"d\" hint-placeholder-count=\"35\">\n<div style=\"height: 40px; box-sizing: border-box; border-radius: 12px; background: {{d.bg}}; border: {{d.border}}; color: {{d.fg}}; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center\">{{ d.n }}<\/div>\n<\/sc-for>\n<\/div>\n<div style=\"display: flex; justify-content: center; gap: 16px; font-size: 13px; color: #B9BDE6\">\n<span style=\"display: flex; align-items: center; gap: 6px\"><span style=\"width: 12px; height: 12px; border-radius: 4px; background: #3DD6C3\"><\/span>Çözüldü<\/span>\n<span style=\"display: flex; align-items: center; gap: 6px\"><span style=\"width: 12px; height: 12px; border-radius: 4px; background: #FF9F45\"><\/span>Bugün<\/span>\n<span style=\"display: flex; align-items: center; gap: 6px\"><span style=\"width: 12px; height: 12px; box-sizing: border-box; border-radius: 4px; border: 2px solid #3A4080\"><\/span>Kaçırıldı<\/span>\n<\/div>\n<\/div>\n<div style=\"margin-top: auto; display: flex; flex-direction: column; gap: 12px\">\n<div style=\"display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; background: #232750; border-radius: 18px; font-size: 16px; font-weight: 500\">\n<span>{{ dateLabel }}<\/span>\n<span style=\"display: flex; align-items: center; gap: 6px; color: #FFD35C\">\n<svg viewBox=\"0 0 24 24\" width=\"18\" height=\"18\" fill=\"#FFD35C\" aria-hidden=\"true\"><path d=\"M12 2.500l2.900 6.200 6.600.8-4.900 4.600 1.300 6.600L12 17.400l-5.900 3.300 1.300-6.600-4.900-4.600 6.600-.8z\"/><\/svg>\n{{ rewardLabel }}<\/span>\n<\/div>\n<button onclick=\"{{ play }}\" style=\"height: 72px; box-sizing: border-box; padding-bottom: 6px; border: 0; background: #FF9F45; border-radius: 22px; box-shadow: inset 0 -6px 0 #D9772A; color: #171A36; font-family: inherit; text-decoration: none; font-size: 22px; font-weight: 700; display: flex; align-items: center; justify-content: center; cursor: pointer\">{{ playLabel }}<\/button>\n<\/div>\n<\/div>\n", "code": "\nclass Component extends DCLogic {\n  renderVals() {\n    var d = App.data;\n    var now = new Date();\n    var year = now.getFullYear(), month = now.getMonth(), today = now.getDate();\n    var monthNames = ['Ocak', 'Şubat', 'Mart', 'Nisan', 'Mayıs', 'Haziran', 'Temmuz', 'Ağustos', 'Eylül', 'Ekim', 'Kasım', 'Aralık'].map(App.tr);\n    var firstWeekday = (new Date(year, month, 1).getDay() + 6) % 7; // 0=Mon\n    var daysInMonth = new Date(year, month + 1, 0).getDate();\n    var days = [];\n    for (var i = 0; i < firstWeekday; i++) days.push({ n: '', bg: 'transparent', border: '0', fg: '#FFFFFF' });\n    for (var n = 1; n <= daysInMonth; n++) {\n      var key = year + '-' + String(month + 1).padStart(2, '0') + '-' + String(n).padStart(2, '0');\n      var dd = { n: n, bg: 'transparent', border: '0', fg: '#8D93C9' };\n      if (d.daily.claimed[key]) { dd.bg = '#3DD6C3'; dd.fg = '#171A36'; }\n      else if (n === today) { dd.bg = '#FF9F45'; dd.fg = '#171A36'; }\n      else if (n < today) { dd.border = '2px solid #3A4080'; dd.fg = '#B9BDE6'; }\n      days.push(dd);\n    }\n    var lvlIdx = App.dailyLevelIndex();\n    var lv = App.getLevel(lvlIdx);\n    var todayKey = App.dateKey();\n    var doneToday = !!d.daily.claimed[todayKey];\n    return {\n      streak: d.daily.streak,\n      streakLabel: App.t('{n} günlük seri', { n: d.daily.streak }),\n      streakSub: doneToday ? App.t('Bugün çözdün, yarın tekrar gel!') : App.t('Bugünü de oyna, seriyi {n} güne çıkar.', { n: d.daily.streak + 1 }),\n      monthLabel: monthNames[month] + ' ' + year,\n      days: days,\n      dateLabel: App.t('{d} {m} · {tier}', { d: today, m: monthNames[month], tier: App.t(lv.tier) }),\n      rewardLabel: doneToday ? App.t('Bugün tamamlandı') : App.t('Ödül: {n} yıldız', { n: 3 + Math.min(7, d.daily.streak + 1) }),\n      playLabel: App.t(doneToday ? 'Yarın tekrar gel' : 'Bugünkü bulmacayı oyna'),\n      play: function () {\n        if (doneToday) { App.sfx('error'); App.toast(App.t('Bugünün bulmacası zaten tamamlandı')); return; }\n        d.currentLevelIndex = lvlIdx; d.pendingRestart = true; d.dailyMode = true;\n        window.go('Game');\n      }\n    };\n  }\n}\n"}, "Reward": {"markup": "\n<div style=\"width: 390px; height: 844px; box-sizing: border-box; background: #0E1024; color: #FFFFFF; font-family: 'Baloo 2', system-ui, sans-serif; padding: 56px 20px 32px; display: flex; flex-direction: column; justify-content: center\">\n<div style=\"padding: 28px 20px 20px; background: #232750; border-radius: 28px; display: flex; flex-direction: column; gap: 20px\">\n<div style=\"display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center\">\n<h1 style=\"margin: 0; font-size: 30px; font-weight: 700\">Günlük ödül<\/h1>\n<div style=\"font-size: 15px; color: #B9BDE6\">Her gün gir, ödül büyüsün. 7. gün büyük ödül seni bekliyor.<\/div>\n<\/div>\n<div style=\"display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px\">\n<sc-for list=\"{{ days }}\" as=\"d\" hint-placeholder-count=\"7\">\n<div style=\"grid-column: {{d.span}}; height: 92px; box-sizing: border-box; padding-bottom: {{d.pad}}; border-radius: 16px; background: {{d.bg}}; box-shadow: {{d.shadow}}; border: {{d.border}}; color: {{d.fg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px\">\n<span style=\"font-size: 12px; font-weight: 500\">{{ d.day }}<\/span>\n<svg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.200\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"{{d.icon}}\"><\/path><\/svg>\n<span style=\"font-size: 14px; font-weight: 600\">{{ d.reward }}<\/span>\n<\/div>\n<\/sc-for>\n<\/div>\n<button onclick=\"{{ goDaily }}\" style=\"height: 68px; box-sizing: border-box; padding-bottom: 6px; border: 0; background: #FF9F45; border-radius: 20px; box-shadow: inset 0 -6px 0 #D9772A; color: #171A36; font-family: inherit; text-decoration: none; font-size: 20px; font-weight: 700; display: flex; align-items: center; justify-content: center; cursor: pointer\">{{ ctaLabel }}<\/button>\n<a href=\"Main.dc.html\" style=\"align-self: center; min-height: 44px; display: flex; align-items: center; font-size: 15px; font-weight: 500; color: #B9BDE6\">Sonra<\/a>\n<\/div>\n<\/div>\n", "code": "\nclass Component extends DCLogic {\n  renderVals() {\n    var star = 'M12 2.500l2.900 6.200 6.600.8-4.900 4.600 1.300 6.600L12 17.400l-5.900 3.300 1.300-6.600-4.900-4.600 6.600-.8z';\n    var check = 'M5 12l5 5 9-10';\n    var gift = 'M4 10h16v10H4zM12 10v10M3 7h18v3H3zM12 7c-1-3-5-3-4 0M12 7c1-3 5-3 4 0';\n    var d = App.data;\n    var todayKey = App.dateKey();\n    var doneToday = !!d.daily.claimed[todayKey];\n    var todayPos = doneToday ? ((d.daily.streak - 1) % 7 + 7) % 7 + 1 : (d.daily.streak % 7) + 1;\n    var rewards = [3, 4, 5, 6, 7, 8, 10];\n    var days = rewards.map(function (r, i) {\n      var n = i + 1;\n      var dd = { day: App.t('{n}. gün', { n: n }), reward: App.t('{n} yıldız', { n: r }), icon: star, span: n === 7 ? 'span 2' : 'auto', pad: '0', bg: '#2E3366', shadow: 'none', border: '0', fg: '#FFFFFF' };\n      if (n < todayPos || (n === todayPos && doneToday)) { dd.icon = check; dd.reward = App.t('Alındı'); dd.fg = '#B9BDE6'; }\n      else if (n === todayPos) { dd.bg = '#FFD35C'; dd.shadow = 'inset 0 -5px 0 #D9A92F'; dd.pad = '5px'; dd.fg = '#171A36'; }\n      else { dd.bg = 'transparent'; dd.border = '2px solid #3A4080'; dd.fg = '#B9BDE6'; }\n      return dd;\n    });\n    return {\n      days: days,\n      ctaLabel: doneToday ? App.t('Bugünü tamamladın') : App.t('{n}. gün ödülü için bulmacaya git', { n: todayPos }),\n      goDaily: function () { window.go('Daily'); }\n    };\n  }\n}\n"}, "Leaderboard": {"markup": "\n<div style=\"width: 390px; height: 844px; box-sizing: border-box; background: #171A36; color: #FFFFFF; font-family: 'Baloo 2', system-ui, sans-serif; padding: 56px 20px 32px; display: flex; flex-direction: column; gap: 20px\">\n<div style=\"display: flex; align-items: center; gap: 16px\">\n<a href=\"Profile.dc.html\" aria-label=\"Geri\" style=\"width: 44px; height: 44px; border-radius: 14px; background: #232750; color: #FFFFFF; display: flex; align-items: center; justify-content: center\">\n<svg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.500\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M15 5l-7 7 7 7\"/><\/svg>\n<\/a>\n<h1 style=\"margin: 0; font-size: 24px; font-weight: 600\">Sıralama<\/h1>\n<\/div>\n<div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px\">\n<sc-for list=\"{{ tabs }}\" as=\"tb\" hint-placeholder-count=\"2\">\n<button onClick=\"{{ tb.pick }}\" aria-pressed=\"{{ tb.pressed }}\" style=\"height: 44px; border: 0; border-radius: 22px; background: {{tb.bg}}; color: {{tb.fg}}; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer\">{{ tb.label }}<\/button>\n<\/sc-for>\n<\/div>\n<div style=\"display: flex; flex-direction: column; gap: 8px\">\n<sc-for list=\"{{ rows }}\" as=\"r\" hint-placeholder-count=\"8\">\n<div style=\"height: 62px; box-sizing: border-box; padding: 0 16px 0 12px; border-radius: 16px; background: #232750; box-shadow: {{r.ring}}; display: flex; align-items: center; gap: 12px\">\n<div style=\"width: 32px; height: 32px; flex-shrink: 0; border-radius: 10px; background: {{r.rankBg}}; color: {{r.rankFg}}; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center\">{{ r.rank }}<\/div>\n<div style=\"width: 38px; height: 38px; flex-shrink: 0; border-radius: 50%; background: {{r.avatar}}; color: #171A36; display: flex; align-items: center; justify-content: center\">\n<svg viewBox=\"0 0 24 24\" width=\"20\" height=\"20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.400\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"8\" r=\"4\"/><path d=\"M4 21c0-4 3.600-6.500 8-6.500s8 2.500 8 6.500\"/><\/svg>\n<\/div>\n<div style=\"flex-grow: 1; min-width: 0; font-size: 17px; font-weight: 500\">{{ r.name }}<\/div>\n<div style=\"display: flex; align-items: center; gap: 6px; font-size: 17px; font-weight: 600\">\n<svg viewBox=\"0 0 24 24\" width=\"18\" height=\"18\" fill=\"#FFD35C\" aria-hidden=\"true\"><path d=\"M12 2.500l2.900 6.200 6.600.8-4.900 4.600 1.300 6.600L12 17.400l-5.900 3.300 1.300-6.600-4.900-4.600 6.600-.8z\"/><\/svg>\n<span>{{ r.stars }}<\/span>\n<\/div>\n<\/div>\n<\/sc-for>\n<\/div>\n<div style=\"margin-top: auto; text-align: center; font-size: 14px; color: #B9BDE6\">{{ footer }}<\/div>\n<\/div>\n", "code": "\nclass Component extends DCLogic {\n  renderVals() {\n    var self = this;\n    var tab = (this.state && this.state.tab) || 'arkadas';\n    var tabs = [['arkadas', 'Arkadaşlar'], ['dunya', 'Dünya']].map(function (t) {\n      var on = t[0] === tab;\n      return { label: App.t(t[1]), pressed: on ? 'true' : 'false', bg: on ? '#3DD6C3' : '#232750', fg: on ? '#171A36' : '#B9BDE6', pick: function () { self.setState({ tab: t[0] }); } };\n    });\n    var myStars = App.earnedStarsTotal();\n    var palette = ['#6C8CFF', '#FF7AA8', '#3DD6C3', '#FFD35C'];\n    var names = tab === 'arkadas' ? ['Ela', 'Mert', 'Zeynep', 'Kaan', 'Defne', 'Arda', 'Nil'] : ['Aylin', 'Berk', 'Cem', 'Derya', 'Emre', 'Filiz', 'Gökhan'];\n    var baseScores = tab === 'arkadas' ? [58, 44, 39, 31, 27, 20, 12] : [540, 538, 531, 525, 519, 512, 508];\n    var rows = names.map(function (nm, i) { return { name: nm, stars: baseScores[i] }; });\n    rows.push({ name: App.t('Sen'), stars: myStars, me: true });\n    rows.sort(function (a, b) { return b.stars - a.stars; });\n    rows = rows.map(function (r, i) {\n      var medal = i < 3 && !r.me;\n      return {\n        rank: i + 1, me: !!r.me, name: r.name, stars: r.stars,\n        avatar: r.me ? '#FF9F45' : palette[i % 4],\n        ring: r.me ? '0 0 0 3px #FF9F45' : 'none',\n        rankBg: medal ? '#FFD35C' : '#2E3366', rankFg: medal ? '#171A36' : '#FFFFFF'\n      };\n    });\n    var myRank = rows.filter(function (r) { return r.me; })[0];\n    return { tabs: tabs, rows: rows, footer: App.t(tab === 'arkadas' ? 'Arkadaşların arasında {n}. sıradasın. (Çevrimdışı, sadece bu cihazda)' : 'Bu cihazdaki sıralamada {n}. sıradasın. (Çevrimdışı, sadece bu cihazda)', { n: myRank.rank }) };\n  }\n}\n"}, "Badges": {"markup": "\n<div style=\"width: 390px; height: 844px; box-sizing: border-box; background: #171A36; color: #FFFFFF; font-family: 'Baloo 2', system-ui, sans-serif; padding: 56px 20px 32px; display: flex; flex-direction: column; gap: 20px\">\n<div style=\"display: flex; align-items: center; justify-content: space-between\">\n<a href=\"Profile.dc.html\" aria-label=\"Geri\" style=\"width: 44px; height: 44px; border-radius: 14px; background: #232750; color: #FFFFFF; display: flex; align-items: center; justify-content: center\">\n<svg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.500\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M15 5l-7 7 7 7\"/><\/svg>\n<\/a>\n<h1 style=\"margin: 0; font-size: 24px; font-weight: 600\">Rozetler<\/h1>\n<div style=\"height: 44px; padding: 0 14px; background: #232750; border-radius: 22px; font-size: 17px; font-weight: 600; display: flex; align-items: center\">{{ earnedCount }} / {{ total }}<\/div>\n<\/div>\n<div style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px\">\n<sc-for list=\"{{ badges }}\" as filter(function (b) { return b.earned; }).length;\n    var badges = defs.map(function (b, i) {\n      var accent = COLORS[i % COLORS.length];\n      return {\n        name: b.name, how: b.how, icon: ICON[b.icon] || ICON.check,\n        bg: b.earned ? accent : 'transparent',\n        shadow: b.earned ? 'inset 0 -5px 0 rgba(0,0,0,0.25)' : 'none',\n        border: b.earned ? '0' : '2px solid #3A4080',\n        pad: b.earned ? '5px' : '0',\n        fg: b.earned ? '#171A36' : '#8D93C9',\n        status: b.earned ? App.t('Kazanıldı') : b.status,\n        statusFg: b.earned ? '#3DD6C3' : '#FFD35C'\n      };\n    });\n    return { badges: badges, earnedCount: earnedCount, total: defs.length };\n  }\n}\n"}, "Shop": {"markup": "\n<div style=\"position: relative; width: 390px; height: 844px; box-sizing: border-box; background: #171A36; color: #FFFFFF; font-family: 'Baloo 2', system-ui, sans-serif; padding: 56px 20px 32px; display: flex; flex-direction: column; gap: 20px\">\n<div style=\"display: flex; align-items: center; justify-content: space-between\">\n<a href=\"Main.dc.html\" aria-label=\"Geri\" style=\"width: 44px; height: 44px; border-radius: 14px; background: #232750; color: #FFFFFF; display: flex; align-items: center; justify-content: center\">\n<svg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.500\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M15 5l-7 7 7 7\"/><\/svg>\n<\/a>\n<h1 style=\"margin: 0; font-size: 24px; font-weight: 600\">Mağaza<\/h1>\n<div style=\"display: flex; align-items: center; gap: 10px\">\n<div style=\"display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 12px; background: #232750; border-radius: 20px; font-size: 15px; font-weight: 600\">\n<svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"#FFD35C\" aria-hidden=\"true\"><path d=\"M12 2.5l2.9 6.2 6.6.8-4.9 4.6 1.3 6.6L12 17.4l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z\"/><\/svg>\n<span> // ---- puzzle rules: one implementation shared by the game, the level generator and the tests ----
//
// Rules (Rush Hour family):
//  * The board is SIZE x SIZE. Every block is a straight 1xlen piece (len 2 or 3) that slides
//    only along its own axis: horizontal blocks left/right, vertical blocks up/down.
//  * Blocks never overlap, never pass through each other and never leave the board.
//  * Walls (`wall: true`, 1x1) never move.
//  * One move = sliding one block any number of free cells in one direction.
//  * The target block (`target: true`, drawn with an arrow) wins when it touches the exit:
//    a gap in one edge of the board (`exit.side` = right|left|top|bottom) at row/column

      case 'left': return t.orient === 'h' && t.row === exit.index && t.col === 0;
      case 'bottom': return t.orient === 'v' && t.col === exit.index && t.row + t.len === SIZE;
      case 'top': return t.orient === 'v' && t.col === exit.index && t.row === 0;
    }

  // `fn` maps a cell [r, c] to its new [r, c]; blocks are rebuilt from their mapped cells.

      case 'top': return [-1, exit.index];

    if (rc[1] === SIZE) return { side: 'right', index: rc[0] };
    if (rc[1] === -1) return { side: 'left', index: rc[0] };
    if (rc[0] === -1) return { side: 'top', index: rc[1] };

    mirrorV: function (rc) { return [M - rc[0], rc[1]]; },        // top <-> bottom
    rotateCCW: function (rc) { return [M - rc[1], rc[0]]; },      // right -> top

    range: range, moveTo: moveTo, moves: moves, key: key, solve: solve, validate: validate,

    navigator.serviceWorker.register('sw.js').then(function (r) { swReg = r; }).catch(function () {});
  }

  function dailyDone() { return !!App.data.daily.claimed[App.dateKey()]; }

  // Called when the setting is switched on.
  App.enableNotifications = function () {
    if (!supported || !window.isSecureContext) {
      App.toast(App.t('Bu tarayıcı bildirimleri desteklemiyor; hatırlatma uygulama içinde gösterilecek.'), 3000);
      return;
    }
    var denied = function () { App.toast(App.t('Bildirim izni verilmedi; hatırlatma uygulama içinde gösterilecek.'), 3000); };
    if (Notification.permission === 'denied') { denied(); return; }
    if (Notification.permission === 'default') {
      Notification.requestPermission().then(function (p) { if (p !== 'granted') denied(); });
    }
  };

  function systemReminder() {
    var s = App.data.settings;
    if (!s.bildirim || dailyDone() || !supported || Notification.permission !== 'granted') return;
    if (!document.hidden || new Date().getHours() < REMIND_HOUR) return;
    var today = App.dateKey();
    if (App.data.lastReminder === today) return;
    App.data.lastReminder = today;
    App.save();
    var title = 'Sliding Block Puzzle';
    var opts = { body: App.t('Günlük bulmacan seni bekliyor! Seriyi bozma.'), tag: 'daily' };
    if (swReg && swReg.showNotification) { swReg.showNotification(title, opts); return; }
    try { new Notification(title, opts); } catch (e) {}
  }

  // Shown once a day when the home screen opens.
  App.remindInApp = function () {
    if (!App.data.settings.bildirim || dailyDone()) return;
    var today = App.dateKey();
    if (App.data.lastInAppReminder === today) return;
    App.data.lastInAppReminder = today;
    App.save();
    setTimeout(function () { App.toast(App.t('Günlük bulmacan seni bekliyor!'), 2600); }, 600);
  };

  setInterval(systemReminder, 60000);
  document.addEventListener('visibilitychange', systemReminder);
})(window.App);

(function () {
  var data = JSON.parse(document.getElementById('screens').textContent);
  var stage = document.getElementById('stage');
  var HOLE = /\{\{([^}]+)\}\}/g;
  var WHOLE = /^\s*\{\{([^}]+)\}\}\s*$/;

  function lookup(scope, path) {
    path = path.trim();
    if (path === 'true') return true;
    if (path === 'false') return false;
    var o = scope, parts = path.split('.');
    for (var i = 0; i < parts.length; i++) { if (o == null) return undefined; o = o[parts[i]]; }
    return o;
  }
  function fill(str, scope) {
    return str.replace(HOLE, function (m, p) { var v = lookup(scope, p); return v == null ? '' : v; });
  }
  // Translate literal markup text (before holes are filled) into the active language.
  var TX_ATTRS = { 'aria-label': 1, placeholder: 1, title: 1, alt: 1 };
  function tx(str) {
    var k = str.trim();
    if (!k) return str;
    var v = App.tr(k);
    return v === k ? str : str.replace(k, function () { return v; });
  }
  function kids(node, scope, out) {
    for (var c = node.firstChild; c; c = c.nextSibling) render(c, scope, out);
  }
  function render(node, scope, out) {
    if (node.nodeType === 3) { out.appendChild(document.createTextNode(fill(tx(node.nodeValue), scope))); return; }
    if (node.nodeType !== 1) return;
    var tag = node.localName, m;
    if (tag === 'sc-if') {
      m = WHOLE.exec(node.getAttribute('value') || '');
      if (m && lookup(scope, m[1])) kids(node, scope, out);
      return;
    }
    if (tag === 'sc-for') {
      m = WHOLE.exec(node.getAttribute('list') || '');
      var list = (m && lookup(scope, m[1])) || [];
      var as = node.getAttribute('as') || 'item';
      list.forEach(function (it, i) {
        var s = Object.create(scope); s[as] = it; s.$index = i;
        kids(node, s, out);
      });
      return;
    }
    var el = node.cloneNode(false);
    Array.prototype.slice.call(node.attributes).forEach(function (a) {
      var lname = a.name.toLowerCase();
      var val = TX_ATTRS[lname] ? tx(a.value) : a.value;
      var w = WHOLE.exec(val);
      if (lname.indexOf('on') === 0 && lname.length > 2) {
        el.removeAttribute(a.name);
        var fn = w && lookup(scope, w[1]);
        if (typeof fn === 'function') el.addEventListener(lname.slice(2), fn);
      } else if (w) {
        var v = lookup(scope, w[1]);
        el.setAttribute(a.name, v == null ? '' : v);
      } else if (val.indexOf('{{') !== -1) {
        el.setAttribute(a.name, fill(val, scope));
      } else if (val !== a.value) {
        el.setAttribute(a.name, val);
      }
    });
    kids(node, scope, el);
    out.appendChild(el);
  }

  var views = {};
  Object.keys(data).forEach(function (name) {
    var tpl = document.createElement('template');
    tpl.innerHTML = data[name].markup;
    var box = document.createElement('div');
    box.className = 'screen';
    stage.appendChild(box);
    var view = { box: box };
    function DCLogic() { this.props = {}; this.state = null; }
    DCLogic.prototype.setState = function (patch) {
      this.state = Object.assign({}, this.state, patch);
      view.draw();
    };
    DCLogic.prototype.forceUpdate = function () { view.draw(); };
    DCLogic.prototype.onShow = function () {};
    DCLogic.prototype.onHide = function () {};
    var Component = new Function('DCLogic', data[name].code + '\nreturn Component;')(DCLogic);
    var inst = new Component();
    view.inst = inst;
    view.draw = function () {
      var keep = [];
      Array.prototype.forEach.call(box.querySelectorAll('[style*="overflow-x"],[style*="overflow-y"]'), function (e) { keep.push([e.scrollLeft, e.scrollTop]); });
      var frag = document.createDocumentFragment();
      var vals;
      try { vals = inst.renderVals() || {}; } catch (err) { console.error('renderVals error in', name, err); vals = {}; }
      kids(tpl.content, vals, frag);
      box.textContent = '';
      box.appendChild(frag);
      Array.prototype.forEach.call(box.querySelectorAll('[style*="overflow-x"],[style*="overflow-y"]'), function (e, i) { if (keep[i]) { e.scrollLeft = keep[i][0]; e.scrollTop = keep[i][1]; } });
    };
    view.draw();
    views[name] = view;
  });

  var activeName = null;
  function go(name) {
    if (!views[name]) return;
    if (activeName && views[activeName] && views[activeName].inst.onHide) {
      try { views[activeName].inst.onHide(); } catch (e) { console.error(e); }
    }
    Object.keys(views).forEach(function (n) { views[n].box.classList.toggle('on', n === name); });
    if (views[name].inst.onShow) {
      try { views[name].inst.onShow(); } catch (e) { console.error(e); }
    }
    views[name].draw();
    activeName = name;
  }
  window.go = go;
  window.__views = views;

  stage.addEventListener('click', function (e) {
    if (e.target.closest && e.target.closest('button, a[href]')) { App.sfx('tap'); App.vibrate(6); }
    var a = e.target.closest && e.target.closest('a[href]');
    if (!a) return;
    e.preventDefault();
    var m = /([A-Za-z0-9_-]+)\.dc\.html$/.exec(a.getAttribute('href'));
    if (m) go(m[1]);
  });

  function fit() {
    var w = window.innerWidth, h = window.innerHeight;
    var k = Math.min(w / 390, h / 844);
    var framed = w > 390 * k + 24;
    if (framed) k = Math.min(k, (h - 32) / 844);
    stage.classList.toggle('framed', framed);
    stage.style.transform = 'translate(-50%,-50%) scale(' + k + ')';
    window.App._scale = k;
  }
  window.addEventListener('resize', fit);
  fit();

  // ---- toast ----
  var toastEl = document.createElement('div');
  toastEl.style.cssText = 'position:absolute;left:20px;right:20px;bottom:28px;padding:14px 18px;background:#232750;color:#FFFFFF;border-radius:16px;font-family:Fredoka,system-ui,sans-serif;font-size:15px;font-weight:500;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.4);opacity:0;transform:translateY(10px);transition:opacity .2s,transform .2s;pointer-events:none;z-index:9999';
  stage.appendChild(toastEl);
  var toastTimer = null;
  window.App.toast = function (msg, ms) {
    toastEl.textContent = msg;
    toastEl.style.opacity = '1';
    toastEl.style.transform = 'translateY(0)';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      toastEl.style.opacity = '0';
      toastEl.style.transform = 'translateY(10px)';
    }, ms || 2000);
  };

  go('Splash');
})();



































</script>
